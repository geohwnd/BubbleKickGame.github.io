<!DOCTYPE html>
<html lang="es">
  <head>
    <link rel="icon" href="img/favicon.png">
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Bubble Kick 26 — Street Survival</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: #f7fbff;
        background: radial-gradient(
            circle at 16% 18%,
            rgba(255, 255, 255, 0.22),
            transparent 0 13%,
            transparent 34%
          ),
          radial-gradient(
            ellipse at 74% 52%,
            rgba(93, 240, 214, 0.72) 0 20%,
            transparent 20.5%
          ),
          linear-gradient(135deg, #1d36f3 0%, #315dff 48%, #5df0d6 100%);
        font-family: "Rajdhani", system-ui, sans-serif;
        touch-action: none;
        user-select: none;
      }

      #game-canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        touch-action: none;
      }

      .top-left-controls {
        position: fixed;
        left: max(16px, env(safe-area-inset-left));
        top: max(16px, env(safe-area-inset-top));
        z-index: 20;
        display: flex;
        gap: 10px;
      }

      .menu-btn,
      .restart-btn,
      .play-again-btn,
      .start-btn,
      .dash-btn {
        color: #fff;
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.24);
        border-radius: 999px;
        padding: 10px 15px;
        font-family: "Rajdhani", sans-serif;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 1.4px;
        text-decoration: none;
        text-transform: uppercase;
        cursor: pointer;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.22);
      }

      .action-buttons {
        position: fixed;
        right: max(18px, env(safe-area-inset-right));
        bottom: max(86px, calc(env(safe-area-inset-bottom) + 62px));
        z-index: 20;
        display: flex;
        gap: 10px;
      }

      .dash-btn {
        min-width: 104px;
        background: linear-gradient(
          135deg,
          rgba(185, 255, 34, 0.95),
          rgba(93, 240, 214, 0.82)
        );
        color: #1730c9;
        border: 0;
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.24),
          0 0 24px rgba(185, 255, 34, 0.32);
      }

      .dash-btn.is-cooling {
        opacity: 0.55;
        filter: grayscale(0.35);
      }

      .hud {
        position: fixed;
        top: max(16px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        z-index: 16;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 18px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.31);
        border: 1px solid rgba(255, 255, 255, 0.22);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.24);
      }

      .hud-block {
        min-width: 82px;
        display: grid;
        gap: 2px;
        text-align: center;
      }

      .hud-label {
        color: rgba(255, 255, 255, 0.68);
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 1.7px;
        text-transform: uppercase;
      }

      .hud-value {
        font-family: "Bebas Neue", sans-serif;
        font-size: 38px;
        line-height: 0.92;
        color: #fff;
        text-shadow: 0 0 28px rgba(185, 255, 34, 0.24),
          0 5px 16px rgba(0, 0, 0, 0.42);
      }

      #time-value {
        color: #b9ff22;
      }

      .instructions-panel {
        position: fixed;
        left: 50%;
        bottom: max(24px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 15;
        width: min(820px, calc(100vw - 32px));
        pointer-events: none;
      }

      .instructions-content {
        width: 100%;
        padding: 12px 18px;
        border-radius: 999px;
        text-align: center;
        color: rgba(255, 255, 255, 0.9);
        background: rgba(0, 0, 0, 0.28);
        border: 1px solid rgba(255, 255, 255, 0.2);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
      }

      .danger-vignette {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        opacity: 0;
        background: radial-gradient(
          circle,
          transparent 45%,
          rgba(255, 45, 45, 0.4) 100%
        );
        transition: opacity 0.18s ease;
      }

      .danger-vignette.show {
        opacity: 1;
      }

      .gameover-overlay,
      .start-overlay {
        position: fixed;
        inset: 0;
        z-index: 99;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
        background: radial-gradient(
            ellipse at 72% 48%,
            rgba(93, 240, 214, 0.28),
            transparent 0 34%,
            transparent 55%
          ),
          linear-gradient(
            155deg,
            rgba(29, 54, 243, 0.94),
            rgba(15, 40, 150, 0.97)
          );
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: opacity 0.28s ease;
      }

      .gameover-overlay.hidden,
      .start-overlay.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .gameover-title,
      .start-title {
        font-family: "Bebas Neue", sans-serif;
        font-size: clamp(72px, 12vw, 130px);
        line-height: 0.88;
        color: #fff;
        letter-spacing: 1px;
        text-shadow: 0 7px 28px rgba(0, 0, 0, 0.4),
          5px 5px 0 rgba(0, 0, 40, 0.22);
      }

      .gameover-title span,
      .start-title span {
        color: #b9ff22;
      }

      .gameover-subtitle,
      .start-subtitle {
        max-width: 390px;
        margin: 18px 0 28px;
        color: rgba(255, 255, 255, 0.78);
        font-size: 14px;
        font-weight: 700;
        line-height: 1.55;
      }

      .gameover-stat {
        margin-bottom: 28px;
        font-family: "Bebas Neue", sans-serif;
        font-size: 64px;
        color: #b9ff22;
        text-shadow: 0 0 30px rgba(185, 255, 34, 0.42);
      }

      .mobile-controls {
        position: fixed;
        inset: auto 0 max(78px, env(safe-area-inset-bottom)) 0;
        z-index: 18;
        display: none;
        pointer-events: none;
      }

      .joystick-zone {
        position: absolute;
        left: max(22px, env(safe-area-inset-left));
        bottom: 0;
        width: 128px;
        height: 128px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 255, 255, 0.24);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        pointer-events: auto;
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.22);
      }

      .joystick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 56px;
        height: 56px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: linear-gradient(135deg, #fff, #82f5ff);
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.24);
      }

      @media (max-width: 760px), (pointer: coarse) {
        .mobile-controls {
          display: block;
        }

        .top-left-controls {
          top: max(10px, env(safe-area-inset-top));
          left: 10px;
        }

        .menu-btn,
        .restart-btn {
          padding: 8px 11px;
          font-size: 10px;
        }

        .hud {
          top: max(58px, calc(env(safe-area-inset-top) + 48px));
          gap: 8px;
          padding: 8px 12px;
        }

        .hud-block {
          min-width: 62px;
        }
        .hud-value {
          font-size: 30px;
        }
        .hud-label {
          font-size: 8px;
          letter-spacing: 1px;
        }

        .instructions-panel {
          bottom: max(20px, env(safe-area-inset-bottom));
        }
        .instructions-content {
          font-size: 10px;
          padding: 10px 12px;
        }

        .action-buttons {
          right: 16px;
          bottom: max(86px, calc(env(safe-area-inset-bottom) + 64px));
        }

        .dash-btn {
          min-width: 84px;
          padding: 12px 14px;
          font-size: 11px;
        }
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/"
        }
      }
    </script>
  </head>

  <body>
    <canvas id="game-canvas"></canvas>

    <div class="top-left-controls">
      <a href="index.html" class="menu-btn">← Menú</a>
      <button id="restart-btn" class="restart-btn" type="button">
        ↻ Reiniciar
      </button>
    </div>

    <div class="hud">
      <div class="hud-block">
        <span class="hud-label">Tiempo</span>
        <span class="hud-value" id="time-value">0.00</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">Mejor</span>
        <span class="hud-value" id="best-value">0.00</span>
      </div>
      <div class="hud-block">
        <span class="hud-label">Evitados</span>
        <span class="hud-value" id="avoided-value">0</span>
      </div>
    </div>

    <div class="instructions-panel">
      <div class="instructions-content">
        WASD, mouse o joystick virtual · Dash con Shift/Espacio · entrena para
        Rush Match
      </div>
    </div>

    <div id="danger-vignette" class="danger-vignette"></div>

    <div class="mobile-controls">
      <div id="joystick-zone" class="joystick-zone">
        <div id="joystick-knob" class="joystick-knob"></div>
      </div>
    </div>

    <div class="action-buttons">
      <button id="dash-btn" class="dash-btn" type="button">Dash</button>
    </div>

    <div id="start-overlay" class="start-overlay">
      <div class="start-title">STREET<br /><span>SURVIVAL</span></div>
      <div class="start-subtitle">
        Mantén el balón en tus pies. Los rivales te perseguirán y cada vez serán
        más rápidos.
      </div>
      <button id="start-btn" class="start-btn" type="button">JUGAR</button>
    </div>

    <div id="gameover-overlay" class="gameover-overlay hidden">
      <div class="gameover-title">STREET<br /><span>SURVIVAL</span></div>
      <div class="gameover-subtitle">Te quitaron el balón</div>
      <div class="gameover-stat" id="final-time">0.00 s</div>
      <button class="play-again-btn" id="play-again-btn" type="button">
        Jugar de nuevo
      </button>
    </div>

    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
      import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
      import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

      const canvas = document.getElementById("game-canvas");
      const timeValue = document.getElementById("time-value");
      const bestValue = document.getElementById("best-value");
      const avoidedValue = document.getElementById("avoided-value");
      const restartBtn = document.getElementById("restart-btn");
      const playAgainBtn = document.getElementById("play-again-btn");
      const startBtn = document.getElementById("start-btn");
      const gameoverOverlay = document.getElementById("gameover-overlay");
      const startOverlay = document.getElementById("start-overlay");
      const finalTime = document.getElementById("final-time");
      const dangerVignette = document.getElementById("danger-vignette");
      const joystickZone = document.getElementById("joystick-zone");
      const joystickKnob = document.getElementById("joystick-knob");
      const dashBtn = document.getElementById("dash-btn");

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x3d72ff);
      scene.fog = new THREE.Fog(0x72e9ff, 18, 70);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        180
      );
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;

      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      const bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.26,
        0.2,
        0.84
      );
      composer.addPass(bloomPass);

      const loader = new GLTFLoader();
      const clock = new THREE.Clock();
      const raycaster = new THREE.Raycaster();
      const mouseNdc = new THREE.Vector2();
      const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

      const FIELD = { x: 6.2, zMin: -4.6, zMax: 4.6 };
      const PLAYER_RADIUS = 0.42;
      const ENEMY_RADIUS = 0.43;
      const STEAL_DISTANCE = 0.86;
      const DASH_SPEED = 13.5;
      const DASH_DURATION = 180;
      const DASH_COOLDOWN = 720;
      const DASH_STEAL_RADIUS = 1.06;
      const DASH_KNOCKBACK_FORCE = 4.2;
      const ENEMY_SEPARATION_DISTANCE = 0.92;
      const ENEMY_SEPARATION_STRENGTH = 0.055;

      const MAX_ENEMIES_PER_WAVE = 4;
      const WAVE_DURATION = 9;
      const WAVE_BREAK_DURATION = 1.15;

      let gameActive = false;
      let gameOver = false;
      let surviveTime = 0;
      let avoidedCount = 0;
      let bestTime = Number(localStorage.getItem("bubbleKickStreetBest") || 0);
      let nextEnemyTime = 8;
      let dangerPulse = 0;
      let waveIndex = 0;
      let waveTimer = 0;
      let isChangingWave = false;

      const input = {
        up: false,
        down: false,
        left: false,
        right: false,
        pointerActive: false,
        hasMouseTarget: false,
        mouseTarget: new THREE.Vector3(0, 0, 0),
        joyX: 0,
        joyY: 0,
      };

      const player = {
        group: new THREE.Group(),
        velocity: new THREE.Vector3(),
        target: new THREE.Vector3(0, 0, 0),
        speed: 6.9,
        currentAnim: "idle",
        models: {},
        mixers: {},
        actions: {},
        dashUntil: 0,
        dashCooldownUntil: 0,
        dashDirection: new THREE.Vector3(0, 0, -1),
      };

      const ball = {
        group: new THREE.Group(),
        offset: new THREE.Vector3(0, 0.22, -0.54),
      };

      const enemies = [];

      init();

      async function init() {
        setupLights();
        setupStage();
        setupPlayer();
        setupBall();
        setupInput();
        updateCamera();
        updateHud();

        await Promise.allSettled([
          loadCharacterModel(
            player,
            "idle",
            "models/Character_FootballIdleAnimation.glb",
            "#54a8ff",
            "#f4e46c"
          ),
          loadCharacterModel(
            player,
            "move",
            "models/Character_FootballRunAnimation.glb",
            "#54a8ff",
            "#f4e46c"
          ),
          loadBallModel(),
        ]);

        setCharacterAnimation(
          player,
          player.models.idle ? "idle" : Object.keys(player.models)[0]
        );
        animate();
      }

      function setupLights() {
        scene.add(new THREE.AmbientLight(0xffffff, 1.15));

        const sun = new THREE.DirectionalLight(0xffffff, 2.15);
        sun.position.set(-5, 12, 8);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.camera.left = -12;
        sun.shadow.camera.right = 12;
        sun.shadow.camera.top = 12;
        sun.shadow.camera.bottom = -12;
        scene.add(sun);

        const cyanFill = new THREE.DirectionalLight(0x65ffe7, 1.1);
        cyanFill.position.set(7, 4.5, 5);
        scene.add(cyanFill);

        const limeRim = new THREE.PointLight(0xb9ff22, 1.25, 38);
        limeRim.position.set(0, 7, -8);
        scene.add(limeRim);
      }

      function setupStage() {
        const floor = new THREE.Mesh(
          new THREE.PlaneGeometry(18, 18),
          new THREE.MeshStandardMaterial({
            color: 0x4bbcff,
            roughness: 0.86,
            metalness: 0.02,
          })
        );
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        for (let i = -4; i <= 4; i += 2) {
          const stripe = new THREE.Mesh(
            new THREE.PlaneGeometry(1.2, 18),
            new THREE.MeshBasicMaterial({
              color: 0x315dff,
              transparent: true,
              opacity: 0.11,
            })
          );
          stripe.rotation.x = -Math.PI / 2;
          stripe.position.set(i, 0.006, 0);
          scene.add(stripe);
        }

        const centerGlow = new THREE.Mesh(
          new THREE.CircleGeometry(4.4, 96),
          new THREE.MeshBasicMaterial({
            color: 0x5df0d6,
            transparent: true,
            opacity: 0.22,
            depthWrite: false,
          })
        );
        centerGlow.rotation.x = -Math.PI / 2;
        centerGlow.position.set(2.6, 0.012, -1.2);
        scene.add(centerGlow);

        const grid = new THREE.GridHelper(16, 16, 0xffffff, 0xffffff);
        grid.material.transparent = true;
        grid.material.opacity = 0.055;
        grid.position.y = 0.03;
        scene.add(grid);
      }

      function setupPlayer() {
        player.group.position.set(0, 0, 0.4);
        scene.add(player.group);
        createFallbackCharacter(player.group, "#54a8ff", "#f4e46c");
      }

      function setupBall() {
        const fallback = new THREE.Mesh(
          new THREE.SphereGeometry(0.25, 32, 20),
          new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.42 })
        );
        fallback.castShadow = true;
        ball.group.add(fallback);
        scene.add(ball.group);
      }

      function createFallbackCharacter(parent, firstColor, secondColor) {
        const fallback = new THREE.Group();
        fallback.name = "FallbackCharacter";

        const skin = new THREE.MeshStandardMaterial({
          color: 0xf0b66a,
          roughness: 0.72,
        });
        const shirt = new THREE.MeshStandardMaterial({
          color: firstColor,
          roughness: 0.68,
        });
        const shorts = new THREE.MeshStandardMaterial({
          color: secondColor,
          roughness: 0.68,
        });
        const black = new THREE.MeshStandardMaterial({
          color: 0x050505,
          roughness: 0.8,
        });

        const body = new THREE.Mesh(
          new THREE.CylinderGeometry(0.24, 0.28, 0.72, 18),
          shirt
        );
        body.position.y = 1.05;
        const head = new THREE.Mesh(
          new THREE.SphereGeometry(0.2, 18, 14),
          skin
        );
        head.position.y = 1.62;
        const shortsMesh = new THREE.Mesh(
          new THREE.BoxGeometry(0.52, 0.26, 0.32),
          shorts
        );
        shortsMesh.position.y = 0.64;
        const feet = new THREE.Mesh(
          new THREE.BoxGeometry(0.54, 0.16, 0.46),
          black
        );
        feet.position.y = 0.13;

        fallback.add(body, head, shortsMesh, feet);
        parent.add(fallback);
      }

      async function loadCharacterModel(
        owner,
        key,
        path,
        firstColor,
        secondColor
      ) {
        try {
          const gltf = await loader.loadAsync(path);
          const model = gltf.scene;
          prepareCharacterModel(model, firstColor, secondColor);
          model.visible = false;
          owner.group.add(model);
          owner.models[key] = model;

          const fallback = owner.group.getObjectByName("FallbackCharacter");
          if (fallback) fallback.visible = false;

          if (gltf.animations?.length) {
            const mixer = new THREE.AnimationMixer(model);
            const action = mixer.clipAction(gltf.animations[0]);
            action.setLoop(THREE.LoopRepeat);
            action.play();
            owner.mixers[key] = mixer;
            owner.actions[key] = action;
          }
        } catch (error) {
          console.warn(`No se pudo cargar ${path}`, error);
        }
      }

      async function loadBallModel() {
        try {
          const gltf = await loader.loadAsync("models/Ball_Model.glb");
          ball.group.clear();
          const model = gltf.scene;
          normalizeBallObject(model, 0.5);
          model.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
            }
          });
          ball.group.add(model);
        } catch (error) {
          console.warn("No se pudo cargar Ball_Model.glb", error);
        }
      }

      function prepareCharacterModel(model, firstColor, secondColor) {
        normalizeObject(model, 0.58);
        model.traverse((child) => {
          if (!child.isMesh && !child.isSkinnedMesh) return;
          child.castShadow = true;
          child.receiveShadow = true;
          child.frustumCulled = false;

          const materials = Array.isArray(child.material)
            ? child.material
            : [child.material];
          const cloned = materials.map((material) => {
            const mat = material
              ? material.clone()
              : new THREE.MeshStandardMaterial();
            const key = `${mat.name || ""} ${child.name || ""}`.toLowerCase();

            if (
              key.includes("m_firstcolor") ||
              key.includes("firstcolor") ||
              key.includes("first_color")
            ) {
              mat.color = new THREE.Color(firstColor);
            } else if (
              key.includes("m_secondcolor") ||
              key.includes("secondcolor") ||
              key.includes("second_color")
            ) {
              mat.color = new THREE.Color(secondColor);
            } else if (
              key.includes("m_thirdcolor") ||
              key.includes("thirdcolor") ||
              key.includes("third_color")
            ) {
              mat.color = new THREE.Color("#ffffff");
            } else if (key.includes("m_skin") || key.includes("skin")) {
              mat.color = new THREE.Color("#f0b66a");
              mat.metalness = 0;
              mat.roughness = Math.max(mat.roughness ?? 0.5, 0.72);
            }

            if ("skinning" in mat) mat.skinning = true;
            mat.needsUpdate = true;
            return mat;
          });

          child.material = Array.isArray(child.material) ? cloned : cloned[0];
        });
      }

      function normalizeBallObject(object, targetSize) {
        const box = new THREE.Box3().setFromObject(object);
        const size = new THREE.Vector3();
        const center = new THREE.Vector3();

        box.getSize(size);
        box.getCenter(center);

        const maxDim = Math.max(size.x, size.y, size.z);
        if (maxDim > 0) {
          object.scale.setScalar(targetSize / maxDim);
        }

        const scaledCenter = center.multiplyScalar(object.scale.x);
        object.position.sub(scaledCenter);
      }

      function normalizeObject(object, targetHeight) {
        const box = new THREE.Box3().setFromObject(object);
        const size = new THREE.Vector3();
        const center = new THREE.Vector3();
        box.getSize(size);
        box.getCenter(center);
        object.position.sub(center);
        object.position.y += size.y / 2;
        if (size.y > 0) object.scale.setScalar(targetHeight / size.y);
      }

      function setCharacterAnimation(owner, key) {
        if (!key || !owner.models[key]) return;
        if (owner.currentAnim === key) return;
        owner.currentAnim = key;
        Object.entries(owner.models).forEach(([modelKey, model]) => {
          model.visible = modelKey === key;
        });
        owner.actions[key]?.reset().play();
      }

      function setupInput() {
        window.addEventListener("keydown", (event) => {
          const key = event.key.toLowerCase();
          if (key === "w" || key === "arrowup") input.up = true;
          if (key === "s" || key === "arrowdown") input.down = true;
          if (key === "a" || key === "arrowleft") input.left = true;
          if (key === "d" || key === "arrowright") input.right = true;
          if (key === "r") restartGame();
          if (key === " " || key === "shift") {
            event.preventDefault();
            tryDash();
          }
        });

        window.addEventListener("keyup", (event) => {
          const key = event.key.toLowerCase();
          if (key === "w" || key === "arrowup") input.up = false;
          if (key === "s" || key === "arrowdown") input.down = false;
          if (key === "a" || key === "arrowleft") input.left = false;
          if (key === "d" || key === "arrowright") input.right = false;
        });

        canvas.addEventListener("pointerdown", (event) => {
          if (!gameActive || gameOver) return;
          input.pointerActive = true;
          updateMouseTarget(event);
        });

        canvas.addEventListener("pointermove", (event) => {
          if (!input.pointerActive) return;
          updateMouseTarget(event);
        });

        window.addEventListener("pointerup", () => {
          input.pointerActive = false;
          resetJoystick();
        });

        joystickZone.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          joystickZone.setPointerCapture(event.pointerId);
          updateJoystick(event);
        });

        joystickZone.addEventListener("pointermove", (event) => {
          event.preventDefault();
          updateJoystick(event);
        });

        joystickZone.addEventListener("pointerup", resetJoystick);
        joystickZone.addEventListener("pointercancel", resetJoystick);

        restartBtn.addEventListener("click", restartGame);
        playAgainBtn.addEventListener("click", restartGame);
        startBtn.addEventListener("click", startGame);
        dashBtn?.addEventListener("pointerdown", (event) => {
          event.preventDefault();
          event.stopPropagation();
          tryDash();
        });
      }

      function updateMouseTarget(event) {
        mouseNdc.x = (event.clientX / window.innerWidth) * 2 - 1;
        mouseNdc.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(mouseNdc, camera);
        const point = new THREE.Vector3();
        if (raycaster.ray.intersectPlane(groundPlane, point)) {
          input.hasMouseTarget = true;
          input.mouseTarget.set(
            THREE.MathUtils.clamp(point.x, -FIELD.x, FIELD.x),
            0,
            THREE.MathUtils.clamp(point.z, FIELD.zMin, FIELD.zMax)
          );
          player.target.copy(input.mouseTarget);
        }
      }

      function updateJoystick(event) {
        const rect = joystickZone.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const dx = event.clientX - cx;
        const dy = event.clientY - cy;
        const maxRadius = rect.width * 0.34;
        const distance = Math.min(Math.hypot(dx, dy), maxRadius);
        const angle = Math.atan2(dy, dx);
        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance;
        joystickKnob.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
        input.joyX = x / maxRadius;
        input.joyY = y / maxRadius;
      }

      function resetJoystick() {
        input.joyX = 0;
        input.joyY = 0;
        joystickKnob.style.transform = "translate(-50%, -50%)";
      }

      function getKeyboardVector() {
        const x = (input.right ? 1 : 0) - (input.left ? 1 : 0) + input.joyX;
        const z = (input.down ? 1 : 0) - (input.up ? 1 : 0) + input.joyY;
        const vector = new THREE.Vector3(x, 0, z);
        if (vector.lengthSq() > 1) vector.normalize();
        return vector;
      }

      function getCurrentMoveDirection() {
        const keyboardVector = getKeyboardVector();

        if (keyboardVector.lengthSq() > 0.001) {
          return keyboardVector.normalize();
        }

        if (player.velocity.lengthSq() > 0.001) {
          return player.velocity.clone().normalize();
        }

        return new THREE.Vector3(0, 0, -1)
          .applyAxisAngle(new THREE.Vector3(0, 1, 0), player.group.rotation.y)
          .normalize();
      }

      function isPlayerDashing() {
        return performance.now() < player.dashUntil;
      }

      function tryDash() {
        if (!gameActive || gameOver) return;

        const now = performance.now();
        if (now < player.dashCooldownUntil) return;

        const dashDirection = getCurrentMoveDirection();
        dashDirection.y = 0;

        if (dashDirection.lengthSq() < 0.001) {
          dashDirection.set(0, 0, -1);
        }

        dashDirection.normalize();
        player.dashDirection.copy(dashDirection);
        player.dashUntil = now + DASH_DURATION;
        player.dashCooldownUntil = now + DASH_COOLDOWN;
        player.velocity.copy(dashDirection).multiplyScalar(DASH_SPEED);
        input.hasMouseTarget = false;
      }

      function updateDashButton() {
        if (!dashBtn) return;

        const now = performance.now();
        const remaining = Math.max(0, player.dashCooldownUntil - now);

        if (remaining > 0) {
          dashBtn.classList.add("is-cooling");
          dashBtn.textContent = `${Math.ceil(remaining / 100) / 10}s`;
        } else {
          dashBtn.classList.remove("is-cooling");
          dashBtn.textContent = "Dash";
        }
      }

      function startGame() {
        startOverlay.classList.add("hidden");
        restartGame();
      }

      function restartGame() {
        enemies.forEach((enemy) => scene.remove(enemy.group));
        enemies.length = 0;
        gameActive = true;
        gameOver = false;
        surviveTime = 0;
        avoidedCount = 0;
        nextEnemyTime = 8;
        dangerPulse = 0;
        player.group.position.set(0, 0, 0.4);
        player.velocity.set(0, 0, 0);
        player.target.copy(player.group.position);
        player.dashUntil = 0;
        player.dashCooldownUntil = 0;
        player.dashDirection.set(0, 0, -1);
        input.hasMouseTarget = false;
        gameoverOverlay.classList.add("hidden");
        startEnemyWave();
        updateHud();
      }

      function clearEnemies() {
        enemies.forEach((enemy) => {
          scene.remove(enemy.group);
        });

        enemies.length = 0;
      }

      function startEnemyWave() {
        if (!gameActive || gameOver) return;

        clearEnemies();

        waveTimer = 0;
        isChangingWave = false;
        waveIndex++;

        const enemyCount = Math.min(
          2 + Math.floor(waveIndex / 2),
          MAX_ENEMIES_PER_WAVE
        );

        for (let i = 0; i < enemyCount; i++) {
          spawnEnemy(i);
        }
      }

      function scheduleNextEnemyWave() {
        if (isChangingWave || !gameActive || gameOver) return;

        isChangingWave = true;

        clearEnemies();
        dangerVignette.classList.remove("show");

        window.setTimeout(() => {
          if (!gameActive || gameOver) return;
          startEnemyWave();
        }, WAVE_BREAK_DURATION * 1000);
      }

      async function spawnEnemy(slotIndex = 0) {
        const enemy = {
          group: new THREE.Group(),
          velocity: new THREE.Vector3(),
          speed:
            2.1 + waveIndex * 0.34 + surviveTime * 0.012 + slotIndex * 0.12,
          currentAnim: "idle",
          models: {},
          mixers: {},
          actions: {},
          avoided: false,
          behavior: slotIndex % 4,
          flankSide: slotIndex % 2 === 0 ? 1 : -1,
          predictionTime: 0.35 + (slotIndex % 3) * 0.18,
        };

        const waveSpawnZones = [
          new THREE.Vector3(-FIELD.x, 0, FIELD.zMin + 0.85),
          new THREE.Vector3(FIELD.x, 0, FIELD.zMax - 0.85),
          new THREE.Vector3(-FIELD.x + 1.15, 0, FIELD.zMax),
          new THREE.Vector3(FIELD.x - 1.15, 0, FIELD.zMin),
        ];

        const baseSpawn = waveSpawnZones[slotIndex % waveSpawnZones.length].clone();
        const offsetSign = waveIndex % 2 === 0 ? 1 : -1;
        const laneOffset = (Math.floor(slotIndex / waveSpawnZones.length) + 1) * 0.55;

        if (slotIndex % 2 === 0) {
          baseSpawn.z = THREE.MathUtils.clamp(
            baseSpawn.z + offsetSign * laneOffset,
            FIELD.zMin,
            FIELD.zMax
          );
        } else {
          baseSpawn.x = THREE.MathUtils.clamp(
            baseSpawn.x + offsetSign * laneOffset,
            -FIELD.x,
            FIELD.x
          );
        }

        enemy.group.position.copy(baseSpawn);
        scene.add(enemy.group);
        createFallbackCharacter(enemy.group, "#ff3333", "#111111");
        enemies.push(enemy);

        await Promise.allSettled([
          loadCharacterModel(
            enemy,
            "idle",
            "models/Character_FootballIdleAnimation.glb",
            "#ff3333",
            "#111111"
          ),
          loadCharacterModel(
            enemy,
            "move",
            "models/Character_FootballRunAnimation.glb",
            "#ff3333",
            "#111111"
          ),
        ]);
        setCharacterAnimation(
          enemy,
          enemy.models.idle ? "idle" : Object.keys(enemy.models)[0]
        );
      }

      function updatePlayer(dt) {
        const now = performance.now();

        if (now < player.dashUntil) {
          player.velocity.copy(player.dashDirection).multiplyScalar(DASH_SPEED);
          player.group.position.addScaledVector(player.velocity, dt);
          player.group.position.x = THREE.MathUtils.clamp(
            player.group.position.x,
            -FIELD.x,
            FIELD.x
          );
          player.group.position.z = THREE.MathUtils.clamp(
            player.group.position.z,
            FIELD.zMin,
            FIELD.zMax
          );
          player.group.rotation.y = Math.atan2(
            player.velocity.x,
            player.velocity.z
          );
          setCharacterAnimation(player, "move");
          return;
        }

        const keyboardMove = getKeyboardVector();
        const usingKeys = keyboardMove.lengthSq() > 0.001;

        if (usingKeys) {
          input.hasMouseTarget = false;
          const targetVelocity = keyboardMove.multiplyScalar(player.speed);
          player.velocity.lerp(targetVelocity, 1 - Math.pow(0.001, dt));
          player.group.position.addScaledVector(player.velocity, dt);
          player.target.copy(player.group.position);
        } else if (input.hasMouseTarget) {
          const toTarget = player.target.clone().sub(player.group.position);
          toTarget.y = 0;
          const distance = toTarget.length();
          if (distance > 0.05) {
            const desiredVelocity = toTarget
              .normalize()
              .multiplyScalar(Math.min(player.speed, distance * 7.5));
            player.velocity.lerp(desiredVelocity, 1 - Math.pow(0.002, dt));
            player.group.position.addScaledVector(player.velocity, dt);
          } else {
            player.velocity.multiplyScalar(Math.pow(0.001, dt));
          }
        } else {
          player.velocity.multiplyScalar(Math.pow(0.001, dt));
        }

        player.group.position.x = THREE.MathUtils.clamp(
          player.group.position.x,
          -FIELD.x,
          FIELD.x
        );
        player.group.position.z = THREE.MathUtils.clamp(
          player.group.position.z,
          FIELD.zMin,
          FIELD.zMax
        );

        if (player.velocity.lengthSq() > 0.035) {
          player.group.rotation.y = Math.atan2(
            player.velocity.x,
            player.velocity.z
          );
        }

        setCharacterAnimation(
          player,
          player.velocity.lengthSq() > 0.12 ? "move" : "idle"
        );
      }

      function updateBall() {
        const isMoving = player.velocity.lengthSq() > 0.08;

        const forward = isMoving
          ? player.velocity.clone().setY(0).normalize()
          : new THREE.Vector3(
              Math.sin(player.group.rotation.y),
              0,
              Math.cos(player.group.rotation.y)
            ).normalize();

        const right = new THREE.Vector3(forward.z, 0, -forward.x).normalize();
        const footSwitch = isMoving
          ? Math.sin(performance.now() * 0.014) * 0.045
          : 0;

        const ballTarget = player.group.position
          .clone()
          .add(forward.clone().multiplyScalar(1.2))
          .add(right.multiplyScalar(footSwitch));

        ballTarget.y = 0.16;

        ball.group.position.copy(ballTarget);

        const flatVelocity = player.velocity.clone();
        flatVelocity.y = 0;

        if (flatVelocity.lengthSq() > 0.08) {
          const rollAxis = new THREE.Vector3(
            flatVelocity.z,
            0,
            -flatVelocity.x
          ).normalize();
          const rollSpeed = Math.min(flatVelocity.length() * 0.018, 0.13);
          ball.group.rotateOnWorldAxis(rollAxis, rollSpeed);
        }

      }

      function separateEnemies() {
        for (let i = 0; i < enemies.length; i++) {
          for (let j = i + 1; j < enemies.length; j++) {
            const enemyA = enemies[i];
            const enemyB = enemies[j];

            const delta = enemyA.group.position.clone().sub(enemyB.group.position);
            delta.y = 0;

            const distance = delta.length();
            if (distance <= 0.001 || distance >= ENEMY_SEPARATION_DISTANCE) continue;

            const push = (ENEMY_SEPARATION_DISTANCE - distance) * ENEMY_SEPARATION_STRENGTH;
            delta.normalize();

            enemyA.group.position.addScaledVector(delta, push);
            enemyB.group.position.addScaledVector(delta, -push);

            enemyA.velocity.addScaledVector(delta, push * 1.8);
            enemyB.velocity.addScaledVector(delta, -push * 1.8);
          }
        }
      }

      function getEnemyTargetPosition(enemy) {
        const playerPos = player.group.position.clone();
        const playerVel = player.velocity.clone();
        playerVel.y = 0;

        const forward = playerVel.lengthSq() > 0.08
          ? playerVel.clone().normalize()
          : new THREE.Vector3(
              Math.sin(player.group.rotation.y),
              0,
              Math.cos(player.group.rotation.y)
            ).normalize();

        const right = new THREE.Vector3(forward.z, 0, -forward.x).normalize();

        if (enemy.behavior === 0) {
          return playerPos;
        }

        if (enemy.behavior === 1) {
          return playerPos
            .clone()
            .add(playerVel.multiplyScalar(enemy.predictionTime));
        }

        if (enemy.behavior === 2) {
          return playerPos
            .clone()
            .add(right.multiplyScalar(enemy.flankSide * 1.25))
            .add(forward.multiplyScalar(0.35));
        }

        return playerPos
          .clone()
          .add(forward.multiplyScalar(-0.85))
          .add(right.multiplyScalar(enemy.flankSide * 0.75));
      }

      function keepEnemyInsideField(enemy) {
        enemy.group.position.x = THREE.MathUtils.clamp(
          enemy.group.position.x,
          -FIELD.x,
          FIELD.x
        );
        enemy.group.position.z = THREE.MathUtils.clamp(
          enemy.group.position.z,
          FIELD.zMin,
          FIELD.zMax
        );
      }

      function updateEnemies(dt) {
        let nearest = Infinity;
        enemies.forEach((enemy) => {
          const toPlayer = player.group.position
            .clone()
            .sub(enemy.group.position);
          toPlayer.y = 0;
          const distance = toPlayer.length();
          nearest = Math.min(nearest, distance);

          const targetPosition = getEnemyTargetPosition(enemy);
          const toTarget = targetPosition.sub(enemy.group.position);
          toTarget.y = 0;

          if (toTarget.lengthSq() > 0.001) {
            const desiredVelocity = toTarget
              .normalize()
              .multiplyScalar(enemy.speed + surviveTime * 0.018);

            enemy.velocity.lerp(desiredVelocity, 1 - Math.pow(0.012, dt));
            enemy.group.position.addScaledVector(enemy.velocity, dt);
            keepEnemyInsideField(enemy);
            enemy.group.rotation.y = Math.atan2(
              enemy.velocity.x,
              enemy.velocity.z
            );
            setCharacterAnimation(enemy, "move");
          }

          if (!enemy.avoided && distance > 3.6 && surviveTime > 4) {
            enemy.avoided = true;
            avoidedCount++;
            updateHud();
          }

          if (isChangingWave) {
            dangerVignette.classList.remove("show");
            return;
          }

          const ballDistance = enemy.group.position.distanceTo(
            ball.group.position
          );
          const playerDistance = enemy.group.position.distanceTo(
            player.group.position
          );

          if (isPlayerDashing() && playerDistance < DASH_STEAL_RADIUS) {
            const knockbackDir = enemy.group.position
              .clone()
              .sub(player.group.position);
            knockbackDir.y = 0;

            if (knockbackDir.lengthSq() < 0.001) {
              knockbackDir.copy(player.dashDirection).multiplyScalar(-1);
            }

            knockbackDir.normalize();
            enemy.velocity.addScaledVector(knockbackDir, DASH_KNOCKBACK_FORCE);
            enemy.group.position.addScaledVector(knockbackDir, 0.22);

            if (!enemy.avoided) {
              enemy.avoided = true;
              avoidedCount++;
              updateHud();
            }

            return;
          }

          if (ballDistance < STEAL_DISTANCE) {
            endGame();
          }
        });

        separateEnemies();
        dangerPulse = nearest < 1.75 ? 1 : Math.max(0, dangerPulse - dt * 2.5);
        dangerVignette.classList.toggle("show", dangerPulse > 0.15);
      }

      function updateDifficulty(dt) {
        surviveTime += dt;
        waveTimer += dt;

        if (waveTimer >= WAVE_DURATION) {
          scheduleNextEnemyWave();
        }

        updateHud();
      }

      function endGame() {
        if (gameOver) return;
        gameOver = true;
        gameActive = false;
        dangerVignette.classList.remove("show");
        bestTime = Math.max(bestTime, surviveTime);
        localStorage.setItem(
          "bubbleKickStreetBest",
          String(bestTime.toFixed(2))
        );
        finalTime.textContent = `${surviveTime.toFixed(2)} s`;
        updateHud();
        gameoverOverlay.classList.remove("hidden");
      }

      function updateHud() {
        timeValue.textContent = surviveTime.toFixed(2);
        bestValue.textContent = bestTime.toFixed(2);
        avoidedValue.textContent = String(avoidedCount);
      }

      function updateCamera() {
        const mobile =
          window.innerWidth < 780 || window.innerHeight > window.innerWidth;
        if (mobile) {
          camera.position.set(0, 11.5, 14.5);
          camera.fov = 56;
        } else {
          camera.position.set(0, 10, 13);
          camera.fov = 46;
        }
        camera.lookAt(0, 1.0, 0);
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
      }

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.034);

        if (gameActive && !gameOver) {
          updateDifficulty(dt);
          updatePlayer(dt);
          updateBall(dt);
          updateEnemies(dt);
          updateDashButton();
        }

        if (!gameActive || gameOver) {
          updateDashButton();
        }

        Object.values(player.mixers).forEach((mixer) => mixer.update(dt));
        enemies.forEach((enemy) => {
          Object.values(enemy.mixers).forEach((mixer) => mixer.update(dt));
        });

        composer.render();
      }

      window.addEventListener("resize", () => {
        renderer.setSize(window.innerWidth, window.innerHeight, false);
        composer.setSize(window.innerWidth, window.innerHeight);
        bloomPass.resolution.set(window.innerWidth, window.innerHeight);
        updateCamera();
      });
    </script>
  </body>
