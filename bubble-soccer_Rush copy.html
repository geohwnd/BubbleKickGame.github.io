<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bubble Kick — Arcade Soccer</title>
    <link rel="stylesheet" href="css/styleRush.css" />
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div
      id="powerup-inventory-p1"
      class="powerup-inventory"
      title="Power up de fuerza J1"
    >
      <div id="powerup-icon-p1" class="powerup-icon">＋</div>
      <div id="powerup-label-p1" class="powerup-label">J1 vacío</div>
    </div>

    <div
      id="powerup-inventory-p2"
      class="powerup-inventory"
      title="Power up de fuerza J2"
    >
      <div id="powerup-icon-p2" class="powerup-icon">＋</div>
      <div id="powerup-label-p2" class="powerup-label">J2 vacío</div>
    </div>

    <div id="ui">
      <div id="scoreboard">
        <div class="score-side p1">
          <div class="player-dot"></div>
          <span class="score-label" id="p1-score-label">Tú</span>
          <span class="score-num" id="score-p1">0</span>
        </div>
        <div class="score-divider"></div>
        <div class="match-clock">
          <span class="clock-label">Tiempo</span>
          <span class="clock-num" id="match-clock">1:30</span>
        </div>
        <div class="score-divider"></div>
        <div class="score-side p2">
          <span class="score-num" id="score-p2">0</span>
          <span class="score-label" id="p2-score-label">J2</span>
          <div class="player-dot"></div>
        </div>
      </div>
      <div id="turn-indicator">
        <div id="turn-dot"></div>
        <span id="turn-text">MODO RUSH</span>
      </div>
      <div id="strength-bar-wrap" id="strength-bar">
        <span id="strength-label">Fuerza</span>
        <div id="strength-track"><div id="strength-fill"></div></div>
      </div>
    </div>

    <div id="goal-overlay">
      <div id="goal-text">⚽ GOL!</div>
      <div id="scorer-text"></div>
    </div>

    <div id="win-overlay">
      <div id="win-trophy">🏆</div>
      <div id="win-title" id="win-msg">¡GANASTE!</div>
      <div id="win-sub">Partido terminado</div>
      <div id="match-stats">
        <div class="match-stats-title">Estadísticas del partido</div>
        <div id="match-stats-content" class="stats-empty">
          Sin goles registrados
        </div>
      </div>
      <button id="restart-btn" onclick="restartGame()" style="margin-top: 12px">
        NUEVA PARTIDA
      </button>
    </div>

    <div id="instruction">
      J1: WASD para moverte · Space dispara al frente · La IA busca robar y
      atacar
    </div>
    <div id="rush-help">
      J1 WASD · Space dispara al frente · La IA presiona, roba y chuta
    </div>
    <button id="quick-restart-btn" onclick="restartGame()">↺ REINICIAR</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script>
      const canvas = document.getElementById("canvas");
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.setClearColor(0x051f14);

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x051f14, 0.04);

      // ─── Camera ───────────────────────────────────────────────
      const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
      camera.position.set(0, 16, 14);
      camera.lookAt(0, 0, 0);

      function resize() {
        const w = window.innerWidth,
          h = window.innerHeight;
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      window.addEventListener("resize", resize);
      resize();

      // ─── Lights ───────────────────────────────────────────────
      const ambient = new THREE.AmbientLight(0xffeebb, 0.6);
      scene.add(ambient);
      const sun = new THREE.DirectionalLight(0xffffff, 1.2);
      sun.position.set(8, 20, 10);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.near = 1;
      sun.shadow.camera.far = 60;
      sun.shadow.camera.left = -15;
      sun.shadow.camera.right = 15;
      sun.shadow.camera.top = 15;
      sun.shadow.camera.bottom = -15;
      scene.add(sun);
      const fill = new THREE.DirectionalLight(0xaabbff, 2.4);
      fill.position.set(-5, 8, -5);
      scene.add(fill);

      // ─── Field ────────────────────────────────────────────────
      const FIELD_W = 14,
        FIELD_H = 10;
      const CORNER_PUSH_RADIUS = 1.45;
      const CORNER_PUSH_FORCE = 5.8;
      const PLAYER_BODY_RADIUS = 0.42;
      const PLAYER_VISUAL_SCALE = 1.1;

      // Procedural stadium. This is the main visual arena for now.
      const proceduralFieldGroup = new THREE.Group();
      scene.add(proceduralFieldGroup);

      const fieldGeo = new THREE.PlaneGeometry(FIELD_W, FIELD_H);
      const fieldMat = new THREE.MeshLambertMaterial({ color: 0x2d9e4e });
      const field = new THREE.Mesh(fieldGeo, fieldMat);
      field.rotation.x = -Math.PI / 2;
      field.receiveShadow = true;
      proceduralFieldGroup.add(field);

      // Stripe pattern on field
      for (let i = 0; i < 7; i++) {
        const sg = new THREE.PlaneGeometry(2, FIELD_H);
        const sm = new THREE.MeshLambertMaterial({
          color: i % 2 === 0 ? 0x28923f : 0x2d9e4e,
          transparent: true,
          opacity: 0.6,
        });
        const stripe = new THREE.Mesh(sg, sm);
        stripe.rotation.x = -Math.PI / 2;
        stripe.position.set(-6 + i * 2, 0.01, 0);
        proceduralFieldGroup.add(stripe);
      }

      // Center circle
      const ccGeo = new THREE.RingGeometry(1.4, 1.6, 32);
      const ccMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        side: THREE.DoubleSide,
        opacity: 0.4,
        transparent: true,
      });
      const cc = new THREE.Mesh(ccGeo, ccMat);
      cc.rotation.x = -Math.PI / 2;
      cc.position.y = 0.02;
      proceduralFieldGroup.add(cc);

      // Center dot
      const cdGeo = new THREE.CircleGeometry(0.12, 16);
      const cdMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        opacity: 0.4,
        transparent: true,
      });
      const cd = new THREE.Mesh(cdGeo, cdMat);
      cd.rotation.x = -Math.PI / 2;
      cd.position.y = 0.02;
      proceduralFieldGroup.add(cd);

      // Half line
      const hlGeo = new THREE.PlaneGeometry(0.1, FIELD_H);
      const hlMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        opacity: 0.4,
        transparent: true,
      });
      const hl = new THREE.Mesh(hlGeo, hlMat);
      hl.rotation.x = -Math.PI / 2;
      hl.position.y = 0.02;
      proceduralFieldGroup.add(hl);

      // ─── Borders & walls ──────────────────────────────────────
      // Top and bottom boards only (no side boards — goals cover those sides)
      const GOAL_W = 3;

      function makeBoard(x, y, z, w, h, d) {
        const geo = new THREE.BoxGeometry(w, h, d);
        const mat = new THREE.MeshLambertMaterial({ color: 0xff6b35 });
        const m = new THREE.Mesh(geo, mat);
        m.position.set(x, y, z);
        m.castShadow = true;
        m.receiveShadow = true;
        proceduralFieldGroup.add(m);
      }
      // Top board (z = -FIELD_H/2)
      makeBoard(0, 0.5, -FIELD_H / 2, FIELD_W + 0.6, 1, 0.5);
      // Bottom board (z = +FIELD_H/2)
      makeBoard(0, 0.5, FIELD_H / 2, FIELD_W + 0.6, 1, 0.5);

      // ─── Goals ────────────────────────────────────────────────
      function makeGoal(side) {
        // side: -1 = left goal (x negative), +1 = right goal (x positive)
        // Goals are on left/right sides → posts span Z axis, depth goes in X
        const g = new THREE.Group();
        const postColor = side < 0 ? 0xff4444 : 0x4488ff;
        const postMat = new THREE.MeshLambertMaterial({ color: postColor });

        const GW = GOAL_W; // width of goal opening (spans Z axis)
        const GH = 1.4; // height
        const GD = 1.6; // depth (goes inward in X direction)

        // Two vertical posts at Z = ±GW/2, standing on the goal line (x = side*FIELD_W/2)
        const postGeo = new THREE.CylinderGeometry(0.09, 0.09, GH, 12);

        const postA = new THREE.Mesh(postGeo, postMat);
        postA.position.set(0, GH / 2, -GW / 2);
        postA.castShadow = true;

        const postB = new THREE.Mesh(postGeo, postMat);
        postB.position.set(0, GH / 2, GW / 2);
        postB.castShadow = true;

        // Crossbar: horizontal bar along Z axis at height GH
        const cbGeo = new THREE.CylinderGeometry(0.09, 0.09, GW, 12);
        const cb = new THREE.Mesh(cbGeo, postMat);
        cb.rotation.x = Math.PI / 2; // lay along Z
        cb.position.set(0, GH, 0);
        cb.castShadow = true;

        // Back post (depth): two vertical posts at back
        const backPostA = new THREE.Mesh(postGeo, postMat);
        backPostA.position.set(side * GD, GH / 2, -GW / 2);
        backPostA.castShadow = true;

        const backPostB = new THREE.Mesh(postGeo, postMat);
        backPostB.position.set(side * GD, GH / 2, GW / 2);
        backPostB.castShadow = true;

        // Top side bars (from front posts to back posts)
        const sideBarGeo = new THREE.CylinderGeometry(0.06, 0.06, GD, 8);
        const sideBarA = new THREE.Mesh(sideBarGeo, postMat);
        sideBarA.rotation.z = Math.PI / 2;
        sideBarA.position.set((side * GD) / 2, GH, -GW / 2);

        const sideBarB = new THREE.Mesh(sideBarGeo, postMat);
        sideBarB.rotation.z = Math.PI / 2;
        sideBarB.position.set((side * GD) / 2, GH, GW / 2);

        // Back crossbar
        const backCbGeo = new THREE.CylinderGeometry(0.06, 0.06, GW, 8);
        const backCb = new THREE.Mesh(backCbGeo, postMat);
        backCb.rotation.x = Math.PI / 2;
        backCb.position.set(side * GD, GH, 0);

        // Net: 3 planes (back + two sides) — semi-transparent, no wireframe
        const netMat = new THREE.MeshBasicMaterial({
          color: postColor,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.18,
        });
        // Back face
        const backNet = new THREE.Mesh(new THREE.PlaneGeometry(GW, GH), netMat);
        backNet.position.set(side * GD, GH / 2, 0);
        backNet.rotation.y = Math.PI / 2;

        // Side face A (z = -GW/2)
        const sideNetA = new THREE.Mesh(
          new THREE.PlaneGeometry(GD, GH),
          netMat
        );
        sideNetA.position.set((side * GD) / 2, GH / 2, -GW / 2);

        // Side face B (z = +GW/2)
        const sideNetB = new THREE.Mesh(
          new THREE.PlaneGeometry(GD, GH),
          netMat
        );
        sideNetB.position.set((side * GD) / 2, GH / 2, GW / 2);

        // Top face
        const topNet = new THREE.Mesh(new THREE.PlaneGeometry(GW, GD), netMat);
        topNet.rotation.x = -Math.PI / 2;
        topNet.position.set((side * GD) / 2, GH, 0);

        g.add(
          postA,
          postB,
          cb,
          backPostA,
          backPostB,
          sideBarA,
          sideBarB,
          backCb,
          backNet,
          sideNetA,
          sideNetB,
          topNet
        );
        g.position.set(side * (FIELD_W / 2), 0, 0);
        proceduralFieldGroup.add(g);
        return g;
      }
      makeGoal(-1); // left = P1's goal (attacked by P2)
      makeGoal(1); // right = P2's goal (attacked by P1)

      // ─── Procedural Stadium Details ───────────────────────────
      function createNetTexture() {
        const c = document.createElement("canvas");
        c.width = 128;
        c.height = 128;
        const ctx = c.getContext("2d");
        ctx.clearRect(0, 0, c.width, c.height);
        ctx.strokeStyle = "rgba(235, 242, 255, 0.78)";
        ctx.lineWidth = 4;

        for (let i = -128; i <= 256; i += 18) {
          ctx.beginPath();
          ctx.moveTo(i, 0);
          ctx.lineTo(i + 128, 128);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(i, 128);
          ctx.lineTo(i + 128, 0);
          ctx.stroke();
        }

        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(4, 1.2);
        return tex;
      }

      function addBench(x, z, rotation = 0) {
        const bench = new THREE.Group();
        const woodMat = new THREE.MeshLambertMaterial({ color: 0x9b5b38 });
        const metalMat = new THREE.MeshLambertMaterial({ color: 0xd8d1bc });

        const seat = new THREE.Mesh(
          new THREE.BoxGeometry(2.35, 0.12, 0.34),
          woodMat
        );
        seat.position.y = 0.34;
        seat.castShadow = true;
        seat.receiveShadow = true;

        const back = new THREE.Mesh(
          new THREE.BoxGeometry(2.35, 0.12, 0.28),
          woodMat
        );
        back.position.set(0, 0.72, -0.22);
        back.rotation.x = -0.25;
        back.castShadow = true;

        for (const sx of [-0.85, 0.85]) {
          const legA = new THREE.Mesh(
            new THREE.BoxGeometry(0.08, 0.36, 0.08),
            metalMat
          );
          legA.position.set(sx, 0.16, -0.12);
          const legB = legA.clone();
          legB.position.z = 0.16;
          bench.add(legA, legB);
        }

        bench.add(seat, back);
        bench.position.set(x, 0, z);
        bench.rotation.y = rotation;
        proceduralFieldGroup.add(bench);
      }

      function addWall(x, z, w, d, h = 0.72) {
        const wall = new THREE.Mesh(
          new THREE.BoxGeometry(w, h, d),
          new THREE.MeshLambertMaterial({ color: 0x8f9399 })
        );
        wall.position.set(x, h / 2, z);
        wall.castShadow = true;
        wall.receiveShadow = true;
        proceduralFieldGroup.add(wall);
        return wall;
      }

      function addFence(x, z, w, h, rotationY = 0) {
        const netTex = createNetTexture();
        const netMat = new THREE.MeshBasicMaterial({
          map: netTex,
          transparent: true,
          opacity: 0.72,
          side: THREE.DoubleSide,
        });
        const fence = new THREE.Mesh(new THREE.PlaneGeometry(w, h), netMat);
        fence.position.set(x, 1.65, z);
        fence.rotation.y = rotationY;
        proceduralFieldGroup.add(fence);

        const postMat = new THREE.MeshLambertMaterial({ color: 0xbfc5cc });
        const postCount = Math.max(2, Math.floor(w / 2.1));
        for (let i = 0; i <= postCount; i++) {
          const t = i / postCount - 0.5;
          const post = new THREE.Mesh(
            new THREE.BoxGeometry(0.09, h + 0.35, 0.09),
            postMat
          );
          if (rotationY === 0) {
            post.position.set(x + t * w, 1.55, z);
          } else {
            post.position.set(x, 1.55, z + t * w);
          }
          post.castShadow = true;
          proceduralFieldGroup.add(post);
        }
      }

      function addProceduralStadiumDetails() {
        // Larger terrace around the field, inspired by the model reference.
        const terrace = new THREE.Mesh(
          new THREE.PlaneGeometry(FIELD_W + 5.2, FIELD_H + 4.4),
          new THREE.MeshLambertMaterial({ color: 0xb77a4a })
        );
        terrace.rotation.x = -Math.PI / 2;
        terrace.position.y = -0.035;
        terrace.receiveShadow = true;
        proceduralFieldGroup.add(terrace);
        terrace.renderOrder = -2;

        // Subtle tile grid on the terrace.
        const tileMat = new THREE.LineBasicMaterial({
          color: 0x7c573f,
          transparent: true,
          opacity: 0.28,
        });
        const tileLines = [];
        const tw = FIELD_W + 5.2;
        const th = FIELD_H + 4.4;
        for (let x = -tw / 2; x <= tw / 2; x += 0.75) {
          tileLines.push(
            new THREE.Vector3(x, 0.002, -th / 2),
            new THREE.Vector3(x, 0.002, th / 2)
          );
        }
        for (let z = -th / 2; z <= th / 2; z += 0.75) {
          tileLines.push(
            new THREE.Vector3(-tw / 2, 0.002, z),
            new THREE.Vector3(tw / 2, 0.002, z)
          );
        }
        const tileGeo = new THREE.BufferGeometry().setFromPoints(tileLines);
        const tileGrid = new THREE.LineSegments(tileGeo, tileMat);
        tileGrid.position.y = -0.02;
        proceduralFieldGroup.add(tileGrid);

        // Low perimeter walls outside the playable field.
        addWall(0, -FIELD_H / 2 - 1.55, FIELD_W + 4.5, 0.34, 0.72);
        addWall(0, FIELD_H / 2 + 1.55, FIELD_W + 4.5, 0.34, 0.72);
        addWall(-FIELD_W / 2 - 1.9, 0, 0.34, FIELD_H + 3.1, 0.72);
        addWall(FIELD_W / 2 + 1.9, 0, 0.34, FIELD_H + 3.1, 0.72);

        // Chain-link style fences above the low walls.
        addFence(0, -FIELD_H / 2 - 1.72, FIELD_W + 4.1, 1.55, 0);
        addFence(0, FIELD_H / 2 + 1.72, FIELD_W + 4.1, 1.55, 0);
        addFence(-FIELD_W / 2 - 2.07, 0, FIELD_H + 2.7, 1.55, Math.PI / 2);
        addFence(FIELD_W / 2 + 2.07, 0, FIELD_H + 2.7, 1.55, Math.PI / 2);

        // Simple back-board and door details for more stadium personality.
        const board = new THREE.Mesh(
          new THREE.BoxGeometry(2.2, 1.45, 0.16),
          new THREE.MeshLambertMaterial({ color: 0x4b4f57 })
        );
        board.position.set(0, 1.35, -FIELD_H / 2 - 1.9);
        board.castShadow = true;
        proceduralFieldGroup.add(board);

        const door = new THREE.Mesh(
          new THREE.BoxGeometry(0.9, 1.65, 0.12),
          new THREE.MeshLambertMaterial({ color: 0x2d3139 })
        );
        door.position.set(2.05, 0.88, -FIELD_H / 2 - 1.93);
        door.castShadow = true;
        proceduralFieldGroup.add(door);

        // Benches around the terrace.
        addBench(-3.8, -FIELD_H / 2 - 1.05, 0);
        addBench(3.8, -FIELD_H / 2 - 1.05, 0);
        addBench(-3.8, FIELD_H / 2 + 1.05, Math.PI);
        addBench(3.8, FIELD_H / 2 + 1.05, Math.PI);
      }

      addProceduralStadiumDetails();

      // ─── Corner Assist Visuals ────────────────────────────────
      function addCornerAssistVisual(x, z) {
        const group = new THREE.Group();

        const baseMat = new THREE.MeshLambertMaterial({
          color: 0x080808,
          transparent: true,
          opacity: 0.82,
        });

        const glowMat = new THREE.MeshBasicMaterial({
          color: 0x111111,
          transparent: true,
          opacity: 0.22,
          side: THREE.DoubleSide,
        });

        const bumper = new THREE.Mesh(
          new THREE.SphereGeometry(0.34, 24, 16),
          baseMat
        );
        bumper.position.y = 0.28;
        bumper.scale.set(1.15, 0.62, 1.15);
        bumper.castShadow = true;
        bumper.receiveShadow = true;

        const ring = new THREE.Mesh(
          new THREE.RingGeometry(0.42, 0.62, 32),
          glowMat
        );
        ring.rotation.x = -Math.PI / 2;
        ring.position.y = 0.045;

        const arrowDir = new THREE.Vector3(
          -Math.sign(x),
          0,
          -Math.sign(z)
        ).normalize();
        const arrowMatCorner = new THREE.MeshBasicMaterial({
          color: 0x0b0b0b,
          transparent: true,
          opacity: 0.65,
        });
        const arrow = new THREE.Mesh(
          new THREE.ConeGeometry(0.16, 0.42, 18),
          arrowMatCorner
        );
        arrow.position.set(arrowDir.x * 0.35, 0.12, arrowDir.z * 0.35);
        arrow.rotation.x = Math.PI / 2;
        arrow.quaternion.setFromUnitVectors(
          new THREE.Vector3(0, 1, 0),
          arrowDir
        );

        group.add(bumper, ring, arrow);
        group.position.set(x, 0, z);
        proceduralFieldGroup.add(group);
      }

      function addCornerAssistVisuals() {
        const inset = 0.72;
        const x = FIELD_W / 2 - inset;
        const z = FIELD_H / 2 - inset;

        addCornerAssistVisual(-x, -z);
        addCornerAssistVisual(x, -z);
        addCornerAssistVisual(-x, z);
        addCornerAssistVisual(x, z);
      }

      addCornerAssistVisuals();

      // ─── Physics ──────────────────────────────────────────────
      class Body {
        constructor(x, y, z, r, mass) {
          this.pos = new THREE.Vector3(x, y, z);
          this.vel = new THREE.Vector3();
          this.r = r;
          this.mass = mass;
          this.restitution = 0.65;
          this.friction = 0.985;
        }
        update(dt) {
          this.vel.multiplyScalar(this.friction);
          this.pos.addScaledVector(this.vel, dt);
          // Floor bounce
          if (this.pos.y - this.r < 0) {
            this.pos.y = this.r;
            this.vel.y *= -0.4;
          }
          // Ceiling
          if (this.pos.y + this.r > 3) {
            this.pos.y = 3 - this.r;
            this.vel.y *= -0.4;
          }
          // Gravity
          this.vel.y -= 12 * dt;
          if (this.pos.y <= this.r + 0.01) this.vel.y = Math.max(0, this.vel.y);
        }
        get speed() {
          return this.vel.length();
        }
      }

      function collideBodies(a, b) {
        const diff = new THREE.Vector3().subVectors(b.pos, a.pos);
        const dist = diff.length();
        const minDist = a.r + b.r;
        if (dist < minDist && dist > 0.001) {
          const normal = diff.clone().divideScalar(dist);
          const overlap = minDist - dist;
          const totalMass = a.mass + b.mass;
          a.pos.addScaledVector(normal, (-overlap * b.mass) / totalMass);
          b.pos.addScaledVector(normal, (overlap * a.mass) / totalMass);
          const relVel = new THREE.Vector3().subVectors(a.vel, b.vel);
          const speed = relVel.dot(normal);
          if (speed > 0) {
            const restitution = (a.restitution + b.restitution) / 2;
            const j = (-(1 + restitution) * speed) / (1 / a.mass + 1 / b.mass);
            a.vel.addScaledVector(normal, j / a.mass);
            b.vel.addScaledVector(normal, -j / b.mass);
          }
        }
      }

      function applyCornerAssist(body) {
        const HW = FIELD_W / 2;
        const HH = FIELD_H / 2;
        const cornerLimitX = HW - CORNER_PUSH_RADIUS;
        const cornerLimitZ = HH - CORNER_PUSH_RADIUS;

        const nearLeftOrRight = Math.abs(body.pos.x) > cornerLimitX;
        const nearTopOrBottom = Math.abs(body.pos.z) > cornerLimitZ;

        if (!nearLeftOrRight || !nearTopOrBottom) return;

        const sx = Math.sign(body.pos.x) || 1;
        const sz = Math.sign(body.pos.z) || 1;

        // Push diagonally back into the playable field so the ball/players do not die in the corners.
        const pushDir = new THREE.Vector3(-sx, 0, -sz).normalize();

        const cornerPoint = new THREE.Vector3(sx * HW, body.pos.y, sz * HH);
        const distanceToCorner = body.pos.distanceTo(cornerPoint);
        const strength = THREE.MathUtils.clamp(
          1 - distanceToCorner / CORNER_PUSH_RADIUS,
          0.18,
          1
        );

        body.vel.addScaledVector(
          pushDir,
          CORNER_PUSH_FORCE * strength * (body.mass < 1 ? 1.25 : 1)
        );

        // Move it slightly inside so it does not immediately collide with both walls again.
        body.pos.x = THREE.MathUtils.clamp(
          body.pos.x,
          -HW + body.r + 0.05,
          HW - body.r - 0.05
        );
        body.pos.z = THREE.MathUtils.clamp(
          body.pos.z,
          -HH + body.r + 0.05,
          HH - body.r - 0.05
        );
      }

      function wallBounce(body) {
        const HW = FIELD_W / 2,
          HH = FIELD_H / 2;
        // Left/right walls (with goal openings)
        const inGoalZone = Math.abs(body.pos.z) < GOAL_W / 2;
        if (!inGoalZone) {
          if (body.pos.x - body.r < -HW) {
            body.pos.x = -HW + body.r;
            body.vel.x *= -body.restitution;
          }
          if (body.pos.x + body.r > HW) {
            body.pos.x = HW - body.r;
            body.vel.x *= -body.restitution;
          }
        }
        // Top/bottom walls
        if (body.pos.z - body.r < -HH) {
          body.pos.z = -HH + body.r;
          body.vel.z *= -body.restitution;
        }
        if (body.pos.z + body.r > HH) {
          body.pos.z = HH - body.r;
          body.vel.z *= -body.restitution;
        }

        applyCornerAssist(body);
      }

      // ─── Meshes ───────────────────────────────────────────────

            sanitizeTeamColor(color, fallbackPalette[index] || "#ffffff")

        while (sanitized.length < 3) {
          sanitized.push(fallbackPalette[sanitized.length] || "#ffffff");
        }

        return sanitized;
      }

              return typeof value === "string" && value.trim()

      function makeBobble(teamColors) {
        const colors = sanitizeTeamPalette(teamColors, [
          "#ff4444",
          "#ffffff",
          "#ffcc00",
        ]);
        const g = new THREE.Group();

        // Fallback temporal mientras carga el GLB.
        const fallbackMat = new THREE.MeshLambertMaterial({ color: colors[0] });
        const fallback = new THREE.Mesh(
          new THREE.SphereGeometry(0.42, 20, 14),
          fallbackMat
        );
        fallback.position.set(0, 0.42, 0);
        fallback.castShadow = true;
        fallback.receiveShadow = true;
        g.add(fallback);

        const characterLoader = new THREE.GLTFLoader();
        characterLoader.load(
          "models/Character_FootballRunAnimation.glb",
          (gltf) => {
            const model = gltf.scene;

            function tintOriginalMaterial(originalMaterial, color) {
              const material = originalMaterial
                ? originalMaterial.clone()
                : new THREE.MeshStandardMaterial();
              material.color = new THREE.Color(color);
              material.skinning = true;
              material.needsUpdate = true;
              return material;
            }

            model.traverse((child) => {
              if (!child.isMesh && !child.isSkinnedMesh) return;

              child.castShadow = true;
              child.receiveShadow = true;
              child.frustumCulled = false;

              const originalMaterial = child.material;
              const matName = originalMaterial?.name?.toLowerCase() || "";
              const objName = child.name?.toLowerCase() || "";
              const key = `${matName} ${objName}`;

              if (
                key.includes("m_firstcolor") ||
                key.includes("firstcolor") ||
                key.includes("first_color")
              ) {
                child.material = tintOriginalMaterial(
                  originalMaterial,
                  colors[0]
                );
              } else if (
                key.includes("m_secondcolor") ||
                key.includes("secondcolor") ||
                key.includes("second_color")
              ) {
                child.material = tintOriginalMaterial(
                  originalMaterial,
                  colors[1]
                );
              } else if (
                key.includes("m_thirdcolor") ||
                key.includes("thirdcolor") ||
                key.includes("third_color")
              ) {
                child.material = tintOriginalMaterial(
                  originalMaterial,
                  colors[2]
                );
              } else if (originalMaterial) {
                child.material = originalMaterial.clone();
                child.material.skinning = true;
                child.material.needsUpdate = true;
              }
            });

            // Centrar y normalizar el modelo para que coincida con el tamaño de los jugadores actuales.
            const box = new THREE.Box3().setFromObject(model);
            const size = new THREE.Vector3();
            const center = new THREE.Vector3();
            box.getSize(size);
            box.getCenter(center);

            model.position.sub(center);
            model.position.y += size.y / 2;

            const targetHeight = 1.35;
            if (size.y > 0) {
              model.scale.setScalar(targetHeight / size.y);
            }

            g.remove(fallback);
            g.add(model);
            if (gltf.animations && gltf.animations.length > 0) {
              const mixer = new THREE.AnimationMixer(model);

              const runClip =
                gltf.animations.find(
                  (clip) =>
                    clip.name.toLowerCase().includes("run") ||
                    clip.name.toLowerCase().includes("walk") ||
                    clip.name.toLowerCase().includes("animation")
                ) || gltf.animations[0];

              const action = mixer.clipAction(runClip);

              action.reset();

              action.play();

              let lastAnimationTime = performance.now();

              function updateModelAnimation() {
                const now = performance.now();

                const delta = Math.min((now - lastAnimationTime) / 1000, 0.05);

                lastAnimationTime = now;

                mixer.update(delta);

                requestAnimationFrame(updateModelAnimation);
              }

              updateModelAnimation();
            }
          },
          undefined,
          (error) => {
            console.warn(
              "No se pudo cargar models/Character_FootballRunAnimation.glb. Se usará el fallback.",
              error
            );
          }
        );

        return g;
      }

      const p1Mesh = makeBobble(p1TeamColors);

      function makePlayerNameLabel(text, teamColor = "#ffffff") {
        const canvas = document.createElement("canvas");
        canvas.width = 512;
        canvas.height = 128;

        const ctx = canvas.getContext("2d");
        const safeText =
          (text || "").toString().trim().slice(0, 18) || "Jugador";

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = "900 42px Segoe UI, Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        const metrics = ctx.measureText(safeText);
        const paddingX = 34;
        const boxW = Math.min(canvas.width - 24, metrics.width + paddingX * 2);
        const boxH = 66;
        const x = (canvas.width - boxW) / 2;
        const y = (canvas.height - boxH) / 2;
        const r = 28;

        ctx.fillStyle = "rgba(0,0,0,0.72)";
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + boxW - r, y);
        ctx.quadraticCurveTo(x + boxW, y, x + boxW, y + r);
        ctx.lineTo(x + boxW, y + boxH - r);
        ctx.quadraticCurveTo(x + boxW, y + boxH, x + boxW - r, y + boxH);
        ctx.lineTo(x + r, y + boxH);
        ctx.quadraticCurveTo(x, y + boxH, x, y + boxH - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
        ctx.fill();

        ctx.lineWidth = 5;
        ctx.strokeStyle = teamColor;
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "rgba(0,0,0,0.75)";
        ctx.shadowBlur = 6;
        ctx.fillText(safeText, canvas.width / 2, canvas.height / 2 + 1);

        const texture = new THREE.CanvasTexture(canvas);
        texture.needsUpdate = true;

        const material = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          depthTest: false,
          depthWrite: false,
        });

        const sprite = new THREE.Sprite(material);
        sprite.scale.set(1.85, 0.46, 1);
        sprite.renderOrder = 1200;
        scene.add(sprite);

        return sprite;
      }

      const PLAYER_MODEL_FACING_OFFSET = 0;

      function lerpAngle(current, target, amount) {
        const diff = Math.atan2(
          Math.sin(target - current),
          Math.cos(target - current)
        );
        return current + diff * amount;
      }

      function updatePlayerMeshFacing(mesh, body) {
        if (!mesh || !body) return;

        const moveDir = new THREE.Vector3(body.vel.x, 0, body.vel.z);

        if (moveDir.lengthSq() > 0.012) {
          moveDir.normalize();
          body.facing.copy(moveDir);
        }

        const facing = body.facing || moveDir;
        if (!facing || facing.lengthSq() < 0.001) return;

        const targetRotationY =
          Math.atan2(facing.x, facing.z) + PLAYER_MODEL_FACING_OFFSET;

        mesh.rotation.y = lerpAngle(mesh.rotation.y, targetRotationY, 0.22);
      }

      // Shadow circles under players

      // ─── Controlled Player Indicator ──────────────────────────
      const controlledIndicatorGroup = new THREE.Group();

      // Overhead arrow only: clean marker above the active player.

      const controlledRing = new THREE.Group();

      const indicatorLoader = new THREE.GLTFLoader();

        const indicatorModel = gltf.scene;

        indicatorModel.traverse((child) => {

        controlledRing.add(indicatorModel);
      });

      controlledRing.position.y = 0.012;

      controlledIndicatorGroup.renderOrder = 1000;

      // ─── Arrow / Slingshot line ────────────────────────────────

      const movArrowShaft = new THREE.Mesh(

      // ─── Power Up: Fuerza ─────────────────────────────────────
      const POWERUP_RESPAWN_DELAY = 4500;
      const POWERUP_FORCE_DURATION = 6500;
      const POWERUP_FORCE_MULTIPLIER = 1.45;

      let currentPowerup = null;
      let heldPowerupP1 = false;
      let heldPowerupP2 = false;
      let forcePowerupUntilP1 = 0;
      let forcePowerupUntilP2 = 0;
      let powerupRespawnTimer = null;

      const powerupMesh = new THREE.Group();
      const powerupBox = new THREE.Mesh(
        new THREE.BoxGeometry(0.55, 0.55, 0.55),
        new THREE.MeshLambertMaterial({ color: 0xffee00 })
      );
      const powerupWire = new THREE.LineSegments(
        new THREE.EdgesGeometry(new THREE.BoxGeometry(0.6, 0.6, 0.6)),

          color: 0xffffff,

      powerupBox.castShadow = true;
      powerupBox.receiveShadow = true;
      powerupMesh.add(powerupBox, powerupWire);
      powerupMesh.visible = false;
      scene.add(powerupMesh);

      const powerupInventoryP1 = document.getElementById(
        "powerup-inventory-p1"
      );
      const powerupInventoryP2 = document.getElementById(
        "powerup-inventory-p2"
      );
      const powerupIconP1 = document.getElementById("powerup-icon-p1");
      const powerupIconP2 = document.getElementById("powerup-icon-p2");
      const powerupLabelP1 = document.getElementById("powerup-label-p1");
      const powerupLabelP2 = document.getElementById("powerup-label-p2");

      function getRandomPowerupPosition() {
        const padding = 1.5;
        const avoid = [p1Body.pos, p2Body.pos, ballBody.pos];

        for (let i = 0; i < 30; i++) {
          const x = THREE.MathUtils.randFloat(
            -FIELD_W / 2 + padding,
            FIELD_W / 2 - padding
          );
          const z = THREE.MathUtils.randFloat(
            -FIELD_H / 2 + padding,
            FIELD_H / 2 - padding
          );
          const candidate = new THREE.Vector3(x, 0.35, z);

          const isClear = avoid.every((pos) => {
            const flatPos = new THREE.Vector3(pos.x, 0.35, pos.z);
            return candidate.distanceTo(flatPos) > 1.4;
          });

          if (isClear) return candidate;
        }

        return new THREE.Vector3(0, 0.35, -2.2);
      }

      function spawnPowerup() {
        if (currentPowerup || gamePhase === "win") return;
        if (heldPowerupP1 && heldPowerupP2) return;

        currentPowerup = {
          pos: getRandomPowerupPosition(),
          r: 0.48,
        };

        powerupMesh.position.copy(currentPowerup.pos);
        powerupMesh.visible = true;
      }

      function schedulePowerupRespawn(delay = POWERUP_RESPAWN_DELAY) {
        clearTimeout(powerupRespawnTimer);
        powerupRespawnTimer = setTimeout(() => {
          powerupRespawnTimer = null;
          spawnPowerup();
        }, delay);
      }

      function collectPowerup(playerNumber) {
        if (!currentPowerup) return;
        if (playerNumber === 1 && heldPowerupP1) return;
        if (playerNumber === 2 && heldPowerupP2) return;

        if (playerNumber === 1) {
          heldPowerupP1 = true;
        } else {
          heldPowerupP2 = true;
        }

        currentPowerup = null;
        powerupMesh.visible = false;
        updatePowerupInventory();
        schedulePowerupRespawn();
      }

      function updatePowerupInventory() {
        if (heldPowerupP1) {
          powerupInventoryP1.classList.add("has-powerup");
          powerupIconP1.textContent = "💥";
          powerupLabelP1.textContent = "Fuerza J1";
        } else {
          powerupInventoryP1.classList.remove("has-powerup");
          powerupIconP1.textContent = "＋";
          powerupLabelP1.textContent = "J1 vacío";
        }

        if (heldPowerupP2) {
          powerupInventoryP2.classList.add("has-powerup");
          powerupIconP2.textContent = "💥";
          powerupLabelP2.textContent = "Fuerza J2";
        } else {
          powerupInventoryP2.classList.remove("has-powerup");
          powerupIconP2.textContent = "＋";
          powerupLabelP2.textContent = "J2 vacío";
        }
      }

      function useHeldPowerup(playerNumber) {
        if (gamePhase === "win") return;
        if (playerNumber !== currentTurn) return;

        if (playerNumber === 1) {
          if (!heldPowerupP1) return;
          heldPowerupP1 = false;
          forcePowerupUntilP1 = performance.now() + POWERUP_FORCE_DURATION;
        } else {
          if (!heldPowerupP2) return;
          heldPowerupP2 = false;
          forcePowerupUntilP2 = performance.now() + POWERUP_FORCE_DURATION;
        }

        updatePowerupInventory();
      }

      function updatePowerups() {
        const now = performance.now();

        if (currentPowerup) {
          powerupMesh.rotation.y += 0.035;
          powerupMesh.rotation.x += 0.012;
          powerupMesh.position.y =
            currentPowerup.pos.y + Math.sin(now * 0.004) * 0.12;

          const p1Flat = new THREE.Vector3(p1Body.pos.x, 0.35, p1Body.pos.z);
          const p2Flat = new THREE.Vector3(p2Body.pos.x, 0.35, p2Body.pos.z);

          if (
            p1Flat.distanceTo(currentPowerup.pos) <
            p1Body.r + currentPowerup.r
          ) {
            collectPowerup(1);
          } else if (
            p2Flat.distanceTo(currentPowerup.pos) <
            p2Body.r + currentPowerup.r
          ) {
            collectPowerup(2);
          }
        }

        if (forcePowerupUntilP1 && now > forcePowerupUntilP1) {
          forcePowerupUntilP1 = 0;
        }

        if (forcePowerupUntilP2 && now > forcePowerupUntilP2) {
          forcePowerupUntilP2 = 0;
        }
      }

      powerupInventoryP1.addEventListener("click", () => useHeldPowerup(1));
      powerupInventoryP2.addEventListener("click", () => useHeldPowerup(2));
      updatePowerupInventory();
      schedulePowerupRespawn(1200);

      // ─── Game State · Rush Mode ───────────────────────────────
      let p1Score = 0,
        p2Score = 0;
      let currentTurn = 1; // UI/power-up fallback only. Rush does not use turns.
      let gamePhase = "playing"; // playing, goal, win
      const MATCH_DURATION = 90;
      let matchTimeLeft = MATCH_DURATION;
      let matchStartTime = performance.now();
      let matchPausedAt = null;
      let matchPausedTotal = 0;
      const STOP_SPEED = 0.12;
      let goalEvents = [];
      let goalEventLocked = false;

      const RUSH_PLAYER_SPEED = 4.35;
      const RUSH_PLAYER_ACCEL = 0.22;
      const RUSH_DASH_SPEED = 13.5;
      const RUSH_DASH_DURATION = 180;
      const RUSH_DASH_COOLDOWN = 720;
      const RUSH_STEAL_RADIUS = 1.22;
      const RUSH_CONTROL_EXTRA = 0.28;
      const RUSH_BALL_FRONT_DISTANCE = 0.62;

      //IA

      // Ball

      const ballMesh = new THREE.Group();

          soccerBallModel.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
            }
          });

          // Normalize the imported model to match the physics ball radius.
          const box = new THREE.Box3().setFromObject(soccerBallModel);
          const size = new THREE.Vector3();
          box.getSize(size);
          const maxAxis = Math.max(size.x, size.y, size.z);

          if (maxAxis > 0) {
            const scale = targetDiameter / maxAxis;

          const centeredBox = new THREE.Box3().setFromObject(soccerBallModel);
          const center = new THREE.Vector3();
          centeredBox.getCenter(center);
          soccerBallModel.position.sub(center);

      // ─── UI Refs ──────────────────────────────────────────────

      function updateInstructionText() {
        instructionEl.textContent =
          "J1: WASD para moverte · Space dispara al frente · La IA roba, conduce y chuta";
      }
      updateInstructionText();
      function normalizeKey(key) {
        if (key === " ") return "Space";
        if (key === "Shift" || key === "ShiftLeft" || key === "ShiftRight")
          return "Shift";
        if (typeof key === "string" && key.length === 1)
          return key.toLowerCase();
        return key;
      }

      window.addEventListener("keydown", (e) => {
        const key = normalizeKey(e.key);
        keys.add(key);

        if (["w", "a", "s", "d", "Space", "Shift"].includes(key)) {
          e.preventDefault();
        }

        if (key === "Shift" && !e.repeat) {
          tryDash(p1Body);
        }

        if (key === "Space" && !e.repeat) startKickCharge(1);
      });

      window.addEventListener("keyup", (e) => {
        const key = normalizeKey(e.key);
        keys.delete(key);

        if (key === "Space") {
          e.preventDefault();
        }
      });

      window.addEventListener("blur", () => {
        keys.clear();
        p1Body.dashUntil = 0;

        strengthWrap.classList.remove("visible");
        strengthFill.style.width = "0%";
