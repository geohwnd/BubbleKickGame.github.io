      function getMoveInput(playerNumber) {
        const input = new THREE.Vector3();

        if (playerNumber === 1) {
          if (keys.has("w")) input.z -= 1;
          if (keys.has("s")) input.z += 1;
          if (keys.has("a")) input.x -= 1;
          if (keys.has("d")) input.x += 1;
        } else {
          if (keys.has("ArrowUp")) input.z -= 1;
          if (keys.has("ArrowDown")) input.z += 1;
          if (keys.has("ArrowLeft")) input.x -= 1;
          if (keys.has("ArrowRight")) input.x += 1;
        }

        if (input.lengthSq() > 0) input.normalize();
        return input;
      }

      function getControlledPlayerBody() {
        return playerTeamBodies[controlledPlayerIndex] || p1Body;
      }

      function getAIControlledBody() {
        return aiTeamBodies[aiCarrierIndex] || p2Body;
      }

      function getBodyByPlayer(playerNumber) {
        return playerNumber === 1
          ? getControlledPlayerBody()
          : getAIControlledBody();
      }

      function getClosestBodyTo(targetPos, bodies) {
        let closestBody = bodies[0];
        let closestIndex = 0;
        let closestDist = Infinity;

        bodies.forEach((body, index) => {
          const dist = body.pos.distanceTo(targetPos);
          if (dist < closestDist) {
            closestBody = body;
            closestIndex = index;
            closestDist = dist;
          }
        });

        return { body: closestBody, index: closestIndex, dist: closestDist };
      }

      function tryDash(body, preferredDirection = null) {
        if (gamePhase !== "playing") return;

        const now = performance.now();
        if (now < body.dashCooldownUntil) return;

        let dashDir = preferredDirection ? preferredDirection.clone() : null;

        if (!dashDir && playerOutfieldBodies.includes(body)) {
          dashDir = getMoveInput(1);
        }

        if (!dashDir || dashDir.lengthSq() < 0.001) {
          dashDir = body.facing.clone();
        }

        dashDir.y = 0;
        if (dashDir.lengthSq() < 0.001)
          dashDir.set(body === p2Body ? -1 : 1, 0, 0);
        dashDir.normalize();

        body.facing.copy(dashDir);
        body.dashUntil = now + RUSH_DASH_DURATION;
        body.dashCooldownUntil = now + RUSH_DASH_COOLDOWN;
        body.vel.x = dashDir.x * RUSH_DASH_SPEED;
        body.vel.z = dashDir.z * RUSH_DASH_SPEED;
      }

      function isPlayerNearBall(extra = 0.45) {
        const controlledBody = getControlledPlayerBody();
        return (
          controlledBody.pos.distanceTo(ballBody.pos) <
          controlledBody.r + ballBody.r + RUSH_CONTROL_EXTRA + extra
        );
      }

      function ensurePlayerPossessionIfNearBall() {
        if (ballCarrier === 1) return true;
        if (performance.now() < playerPickupBlockedUntil) return false;

        if (!ballCarrier && isPlayerNearBall()) {
          setLastTouch(1, controlledPlayerIndex);
          ballCarrier = 1;
          currentTurn = 1;
          ballBody.vel.set(0, 0, 0);
          updateTurnUI();
          return true;
        }

        return false;
      }

      function startKickCharge(playerNumber) {
        // Rush quick shot: Space shoots instantly in the player's forward direction.
        if (gamePhase !== "playing") return;
        if (playerNumber !== 1) return;

        if (!ensurePlayerPossessionIfNearBall()) return;

        const body = getControlledPlayerBody();
        const kickDir = body.facing.clone();
        kickDir.y = 0;
        if (kickDir.lengthSq() < 0.001) kickDir.set(1, 0, 0);
        kickDir.normalize();

        let force = THREE.MathUtils.lerp(
          RUSH_MIN_KICK_FORCE,
          RUSH_MAX_KICK_FORCE,
          0.58
        );

        const now = performance.now();
        const hasP1Force = forcePowerupUntilP1 > now;
        if (hasP1Force) {
          force *= POWERUP_FORCE_MULTIPLIER;
        }

        setLastTouch(1, controlledPlayerIndex);
        ballCarrier = null;
        kickChargingPlayer = null;
        kickChargeStart = 0;
        playerPickupBlockedUntil = performance.now() + 420;
        strengthWrap.classList.remove("visible");
        strengthFill.style.width = "0%";

        ballBody.pos
          .copy(body.pos)
          .addScaledVector(kickDir, body.r + ballBody.r + 0.42);
        ballBody.pos.y = ballBody.r;
        ballBody.vel.copy(kickDir).multiplyScalar(force);
        ballBody.vel.y = 0.85;
        playKickSound(0.72);

        updateTurnUI();
      }

      function releaseKick(playerNumber) {
        // Space no longer charges. The shot happens on keydown.
        return;
      }

      function updateRushChargeUI() {
        // Rush quick shot no longer uses charged Space shots.
        return;
      }

      function moveRushPlayer(body, playerNumber) {
        if (body === p1KeeperBody) {
          updateKeeperAI(body, 1);
          return;
        }

        const now = performance.now();
        const input = getMoveInput(playerNumber);
        const isDashing = now < body.dashUntil;

        if (playerNumber === 1 && body !== getControlledPlayerBody()) {
          updatePlayerTeammateAI(body);
          return;
        }

        if (input.lengthSq() > 0) {
          body.facing.copy(input);
        }

        if (isDashing) {
          const dashBlend = input.lengthSq() > 0 ? input : body.facing;
          body.vel.x = dashBlend.x * RUSH_DASH_SPEED;
          body.vel.z = dashBlend.z * RUSH_DASH_SPEED;
        } else if (input.lengthSq() > 0) {
          const targetVel = input.multiplyScalar(RUSH_PLAYER_SPEED);
          body.vel.x = THREE.MathUtils.lerp(
            body.vel.x,
            targetVel.x,
            RUSH_PLAYER_ACCEL
          );
          body.vel.z = THREE.MathUtils.lerp(
            body.vel.z,
            targetVel.z,
            RUSH_PLAYER_ACCEL
          );
        } else {
          body.vel.x *= 0.82;
          body.vel.z *= 0.82;
        }
      }

      function updatePlayerTeammateAI(body) {
        if (gamePhase !== "playing") return;
        if (body === getControlledPlayerBody()) return;

        const playerSupportLanes = [-2.35, 2.35, 0];
        const bodyIndex = playerTeamBodies.indexOf(body);
        let target;

        if (ballCarrier === 2) {
          // Defensa espejo de la IA: un compañero presiona y los demás cortan línea.
          const supportBodies = playerTeamBodies.filter(
            (b) => b !== getControlledPlayerBody()
          );
          const closestToAI = getClosestBodyTo(
            getAIControlledBody().pos,
            supportBodies
          );

          if (closestToAI.body === body) {
            const aiCarrier = getAIControlledBody();
            const aiToGoal = new THREE.Vector3().subVectors(
              getGoalTargetForPlayer(2),
              aiCarrier.pos
            );
            aiToGoal.y = 0;
            if (aiToGoal.lengthSq() > 0.001) aiToGoal.normalize();

            target = aiCarrier.pos.clone().addScaledVector(aiToGoal, 0.55);
            clampFieldTarget(target, 0.8);
          } else {
            const lane = playerSupportLanes[bodyIndex] || 0;
            target = getPlayerDefensivePoint(lane);
          }
        } else if (ballCarrier === 1) {
          // Ataque: tus compañeros se abren en carriles, no persiguen todos la pelota.
          const lane =
            body === p1Mate1Body ? -2.45 : body === p1Mate2Body ? 2.45 : 0;
          target = getPlayerAttackSupportPoint(body, lane);
        } else {
          // Pelota suelta: el compañero más cercano va por ella, los demás cubren líneas.
          const supportBodies = playerTeamBodies.filter(
            (b) => b !== getControlledPlayerBody()
          );
          const closest = getClosestBodyTo(ballBody.pos, supportBodies);

          if (closest.body === body) {
            target = ballBody.pos;
          } else {
            const lane = body === p1Mate1Body ? -2.25 : 2.25;
            target = getPlayerDefensivePoint(lane);
          }
        }

        const speed = ballCarrier === 2 ? AI_INTERCEPT_SPEED : AI_SUPPORT_SPEED;
        moveBodyArcadeTo(body, target, speed, 0.09);

        if (ballCarrier === 2) {
          const aiBody = getAIControlledBody();
          const dashDir = new THREE.Vector3().subVectors(aiBody.pos, body.pos);
          dashDir.y = 0;

          if (
            dashDir.lengthSq() > 0.001 &&
            body.pos.distanceTo(aiBody.pos) < AI_DASH_PRESS_DISTANCE &&
            Math.random() < 0.026
          ) {
            tryDash(body, dashDir);
          }
        }
      }

      function updateKeeperAI(body, teamNumber) {
        if (!body || gamePhase !== "playing") return;

        const isPlayerKeeper = teamNumber === 1;
        const keeperX = isPlayerKeeper
          ? -FIELD_W / 2 + 0.85
          : FIELD_W / 2 - 0.85;
        const maxZ = GOAL_W / 2 - 0.32;

        // Portero tipo arcade: no persigue la pelota.
        // Solo patrulla de poste a poste para que atajar dependa más de timing/suerte.
        if (body.keeperDirection === undefined) {
          body.keeperDirection = isPlayerKeeper ? 1 : -1;
        }

        const keeperPatrolSpeed = KEEPER_SPEED;
        body.facing.set(isPlayerKeeper ? 1 : -1, 0, 0);
        body.vel.x = THREE.MathUtils.lerp(body.vel.x, 0, 0.22);
        body.vel.z = THREE.MathUtils.lerp(
          body.vel.z,
          body.keeperDirection * keeperPatrolSpeed,
          0.11
        );

        body.pos.x = THREE.MathUtils.lerp(body.pos.x, keeperX, 0.18);

        if (body.pos.z >= maxZ) {
          body.pos.z = maxZ;
          body.keeperDirection = -1;
        } else if (body.pos.z <= -maxZ) {
          body.pos.z = -maxZ;
          body.keeperDirection = 1;
        }

        keeperClearIfNeeded(body, teamNumber);
      }

      function keeperClearIfNeeded(body, teamNumber) {
        if (ballCarrier) return;
        if (body.pos.distanceTo(ballBody.pos) > body.r + ballBody.r + 0.32)
          return;

        // El portero no siempre ataja: deja pasar algunas para que el juego no sea imposible.
        if (Math.random() > KEEPER_SAVE_CHANCE) {
          body.vel.z += THREE.MathUtils.randFloatSpread(1.2);
          return;
        }

        setLastTouch(teamNumber, 3);
        const isPlayerKeeper = teamNumber === 1;
        const direction = isPlayerKeeper ? 1 : -1;
        const targetMate = isPlayerKeeper ? p1Body : p2Body;

        const clearDir = new THREE.Vector3(
          direction,
          0,
          THREE.MathUtils.clamp(targetMate.pos.z - body.pos.z, -1.1, 1.1)
        ).normalize();

        if (isPlayerKeeper) {
          playerPickupBlockedUntil = performance.now() + 520;
        } else {
          aiPickupBlockedUntil = performance.now() + 520;
        }

        ballBody.pos
          .copy(body.pos)
          .addScaledVector(clearDir, body.r + ballBody.r + 0.5);
        ballBody.pos.y = ballBody.r;
        ballBody.vel.copy(clearDir).multiplyScalar(KEEPER_CLEAR_FORCE);
        ballBody.vel.y = 0.75;
        playKickSound(0.58);
      }

      function updateBallPossession() {
        if (ballCarrier) {
          const carrierBody = getBodyByPlayer(ballCarrier);
          ballBody.pos
            .copy(carrierBody.pos)
            .addScaledVector(carrierBody.facing, RUSH_BALL_FRONT_DISTANCE);
          ballBody.pos.y = ballBody.r;
          ballBody.vel.copy(carrierBody.vel);
          updateTurnUI();
          return;
        }

        const closestPlayer = getClosestBodyTo(ballBody.pos, playerTeamBodies);
        const closestAI = getClosestBodyTo(ballBody.pos, aiTeamBodies);
        const now = performance.now();

        if (
          now >= playerPickupBlockedUntil &&
          closestPlayer.dist <
            closestPlayer.body.r + ballBody.r + RUSH_CONTROL_EXTRA
        ) {
          controlledPlayerIndex = playerTeamBodies.indexOf(closestPlayer.body);
          setLastTouch(1, controlledPlayerIndex);
          ballCarrier = 1;
          currentTurn = 1;
        } else if (
          now >= aiPickupBlockedUntil &&
          closestAI.dist < closestAI.body.r + ballBody.r + RUSH_CONTROL_EXTRA
        ) {
          aiCarrierIndex = aiTeamBodies.indexOf(closestAI.body);
          setLastTouch(2, aiCarrierIndex);
          ballCarrier = 2;
          currentTurn = 2;
        }

        updateTurnUI();
      }

      function updateDashSteal() {
        if (!ballCarrier) return;

        const now = performance.now();
        const carrierBody = getBodyByPlayer(ballCarrier);
        const challengerBodies =
          ballCarrier === 1 ? aiOutfieldBodies : playerOutfieldBodies;
        const challengerNumber = ballCarrier === 1 ? 2 : 1;

        const activeChallenger = challengerBodies.find(
          (body) =>
            now < body.dashUntil &&
            body.pos.distanceTo(carrierBody.pos) < RUSH_STEAL_RADIUS
        );
        if (!activeChallenger) return;

        if (challengerNumber === 1) {
          controlledPlayerIndex =
            playerOutfieldBodies.indexOf(activeChallenger);
        } else {
          aiCarrierIndex = aiOutfieldBodies.indexOf(activeChallenger);
        }

        setLastTouch(
          challengerNumber,
          challengerNumber === 1 ? controlledPlayerIndex : aiCarrierIndex
        );
        ballCarrier = challengerNumber;
        currentTurn = challengerNumber;
        ballBody.vel.set(0, 0, 0);
        kickChargingPlayer = null;
        kickChargeStart = 0;
        strengthWrap.classList.remove("visible");
        strengthFill.style.width = "0%";
        updateTurnUI();
      }

      function updateContactSteal() {
        if (!ballCarrier || gamePhase !== "playing") return;

        const now = performance.now();
        if (now < contactStealBlockedUntil) return;

        const carrierBody = getBodyByPlayer(ballCarrier);
        const challengerBodies =
          ballCarrier === 1 ? aiTeamBodies : playerTeamBodies;
        const challengerNumber = ballCarrier === 1 ? 2 : 1;

        let bestChallenger = null;
        let bestDistance = Infinity;

        challengerBodies.forEach((body) => {
          const dist = body.pos.distanceTo(carrierBody.pos);
          const contactRange = carrierBody.r + body.r + 0.16;

          if (dist < contactRange && dist < bestDistance) {
            bestChallenger = body;
            bestDistance = dist;
          }
        });

        if (!bestChallenger) return;

        if (challengerNumber === 1) {
          controlledPlayerIndex = playerTeamBodies.indexOf(bestChallenger);
        } else {
          aiCarrierIndex = aiTeamBodies.indexOf(bestChallenger);
        }

        const stealDir = new THREE.Vector3().subVectors(
          bestChallenger.pos,
          carrierBody.pos
        );
        stealDir.y = 0;

        if (stealDir.lengthSq() < 0.001) {
          stealDir.copy(
            bestChallenger.facing ||
              new THREE.Vector3(challengerNumber === 1 ? 1 : -1, 0, 0)
          );
        }

        stealDir.normalize();

        setLastTouch(
          challengerNumber,
          challengerNumber === 1 ? controlledPlayerIndex : aiCarrierIndex
        );
        ballCarrier = challengerNumber;
        currentTurn = challengerNumber;
        contactStealBlockedUntil = now + 380;
        ballBody.vel.set(0, 0, 0);

        bestChallenger.pos.addScaledVector(stealDir, 0.08);
        carrierBody.pos.addScaledVector(stealDir, -0.08);

        kickChargingPlayer = null;
        kickChargeStart = 0;
        strengthWrap.classList.remove("visible");
        strengthFill.style.width = "0%";

        updateTurnUI();
      }

      function getGoalTargetForPlayer(playerNumber) {
        return playerNumber === 1
          ? new THREE.Vector3(FIELD_W / 2, 0, 0)
          : new THREE.Vector3(-FIELD_W / 2, 0, 0);
      }

      function getOwnGoalForPlayer(playerNumber) {
        return playerNumber === 1
          ? new THREE.Vector3(-FIELD_W / 2, 0, 0)
          : new THREE.Vector3(FIELD_W / 2, 0, 0);
      }

      function clampFieldTarget(target, margin = 0.72) {
        target.x = THREE.MathUtils.clamp(
          target.x,
          -FIELD_W / 2 + margin,
          FIELD_W / 2 - margin
        );
        target.z = THREE.MathUtils.clamp(
          target.z,
          -FIELD_H / 2 + margin,
          FIELD_H / 2 - margin
        );
        target.y = PLAYER_BODY_RADIUS;
        return target;
      }

      function moveBodyArcadeTo(body, target, speed, accel = 0.12) {
        const dir = new THREE.Vector3().subVectors(target, body.pos);
        dir.y = 0;

        if (dir.lengthSq() > 0.04) {
          dir.normalize();
          body.facing.copy(dir);
          body.vel.x = THREE.MathUtils.lerp(body.vel.x, dir.x * speed, accel);
          body.vel.z = THREE.MathUtils.lerp(body.vel.z, dir.z * speed, accel);
        } else {
          body.vel.x *= 0.88;
          body.vel.z *= 0.88;
        }
      }

      function getAIDefensivePoint(laneOffset = 0) {
        const ownGoal = getOwnGoalForPlayer(2);
        const ballFlat = new THREE.Vector3(
          ballBody.pos.x,
          PLAYER_BODY_RADIUS,
          ballBody.pos.z
        );

        // Punto entre balón y portería propia: esto hace que la IA “corte línea”.
        const target = ballFlat
          .clone()
          .lerp(ownGoal, AI_DEFENSE_INTERCEPT_RATIO);
        target.z += laneOffset;
        return clampFieldTarget(target, 0.85);
      }

      function getAIAttackSupportPoint(body, laneOffset = 0) {
        const carrier = getAIControlledBody();
        const attackGoal = getGoalTargetForPlayer(2);
        const toGoal = new THREE.Vector3().subVectors(attackGoal, carrier.pos);
        toGoal.y = 0;
        if (toGoal.lengthSq() > 0.001) toGoal.normalize();

        const side = new THREE.Vector3(-toGoal.z, 0, toGoal.x);
        const target = carrier.pos
          .clone()
          .addScaledVector(toGoal, 1.65)
          .addScaledVector(side, laneOffset);

        return clampFieldTarget(target, 0.9);
      }

      function getPlayerDefensivePoint(laneOffset = 0) {
        const ownGoal = getOwnGoalForPlayer(1);
        const ballFlat = new THREE.Vector3(
          ballBody.pos.x,
          PLAYER_BODY_RADIUS,
          ballBody.pos.z
        );

        // Compañeros del jugador: se paran entre balón y portería propia.
        const target = ballFlat
          .clone()
          .lerp(ownGoal, AI_DEFENSE_INTERCEPT_RATIO);
        target.z += laneOffset;
        return clampFieldTarget(target, 0.85);
      }

      function getPlayerAttackSupportPoint(body, laneOffset = 0) {
        const carrier = getControlledPlayerBody();
        const attackGoal = getGoalTargetForPlayer(1);
        const toGoal = new THREE.Vector3().subVectors(attackGoal, carrier.pos);
        toGoal.y = 0;
        if (toGoal.lengthSq() > 0.001) toGoal.normalize();

        const side = new THREE.Vector3(-toGoal.z, 0, toGoal.x);
        const target = carrier.pos
          .clone()
          .addScaledVector(toGoal, 1.85)
          .addScaledVector(side, laneOffset);

        return clampFieldTarget(target, 0.9);
      }

      function updateRushAI() {
        if (gamePhase !== "playing") return;

        const now = performance.now();
        const attackGoal = getGoalTargetForPlayer(2);
        const playerCarrier = getBodyByPlayer(1);

        if (now >= aiNextDecisionAt) {
          aiNextDecisionAt = now + AI_REACTION_TIME + Math.random() * 85;
          aiWantsShoot = false;

          if (ballCarrier === 2) {
            const carrier = getAIControlledBody();
            const goalDir = new THREE.Vector3().subVectors(
              attackGoal,
              carrier.pos
            );
            goalDir.y = 0;
            if (goalDir.lengthSq() > 0.001) goalDir.normalize();

            const lateral = new THREE.Vector3(
              -goalDir.z,
              0,
              goalDir.x
            ).multiplyScalar(Math.sin(now * 0.005) * 1.15);

            aiMoveTarget.copy(attackGoal).add(lateral);
            clampFieldTarget(aiMoveTarget, 0.9);

            const distToGoal = carrier.pos.distanceTo(attackGoal);
            const isInShootingLane = Math.abs(carrier.pos.z) < GOAL_W / 2 + 0.7;
            const isDeepEnough = carrier.pos.x < AI_SHOOT_X_THRESHOLD;
            const isCloseEnough = distToGoal < AI_SHOOT_RANGE;
            const canShootAgain = now - aiLastShotAt > AI_SHOOT_COOLDOWN;

            aiWantsShoot =
              canShootAgain &&
              (isCloseEnough || (isDeepEnough && isInShootingLane));
          } else if (ballCarrier === 1) {
            const closestToPlayer = getClosestBodyTo(
              playerCarrier.pos,
              aiOutfieldBodies
            );
            aiCarrierIndex = aiOutfieldBodies.indexOf(closestToPlayer.body);

            const playerToGoal = new THREE.Vector3().subVectors(
              getGoalTargetForPlayer(1),
              playerCarrier.pos
            );
            playerToGoal.y = 0;
            if (playerToGoal.lengthSq() > 0.001) playerToGoal.normalize();

            // El presionador va un poco adelante del jugador para cortar carrera, no directo al centro.
            aiMoveTarget
              .copy(playerCarrier.pos)
              .addScaledVector(playerToGoal, 0.55);
            clampFieldTarget(aiMoveTarget, 0.8);

            const distToCarrier = closestToPlayer.body.pos.distanceTo(
              playerCarrier.pos
            );
            const dashToPlayer = new THREE.Vector3().subVectors(
              playerCarrier.pos,
              closestToPlayer.body.pos
            );
            dashToPlayer.y = 0;

            if (
              dashToPlayer.lengthSq() > 0.001 &&
              distToCarrier < AI_DASH_PRESS_DISTANCE &&
              Math.random() < AI_DASH_CHANCE
            ) {
              tryDash(closestToPlayer.body, dashToPlayer);
            }
          } else {
            const closestToBall = getClosestBodyTo(
              ballBody.pos,
              aiOutfieldBodies
            );
            aiCarrierIndex = aiOutfieldBodies.indexOf(closestToBall.body);

            const intercept = getAIDefensivePoint(0);
            const distToBall = closestToBall.body.pos.distanceTo(ballBody.pos);

            // Si la pelota está cerca, va por ella. Si no, corta línea hacia portería.
            aiMoveTarget.copy(
              distToBall < AI_PRESSURE_DISTANCE ? ballBody.pos : intercept
            );
            clampFieldTarget(aiMoveTarget, 0.8);

            const dashToBall = new THREE.Vector3().subVectors(
              ballBody.pos,
              closestToBall.body.pos
            );
            dashToBall.y = 0;

            if (
              dashToBall.lengthSq() > 0.001 &&
              distToBall < AI_DASH_LOOSE_BALL_DISTANCE &&
              Math.random() < 0.58
            ) {
              tryDash(closestToBall.body, dashToBall);
            }
          }
        }

        const activeAI = getAIControlledBody();
        const activeSpeed =
          ballCarrier === 2
            ? AI_DRIBBLE_SPEED
            : ballCarrier === 1
            ? AI_INTERCEPT_SPEED
            : AI_DEFENSE_SPEED;

        moveBodyArcadeTo(activeAI, aiMoveTarget, activeSpeed, 0.13);

        if (ballCarrier === 2) {
          const carrier = getAIControlledBody();
          const distToGoal = carrier.pos.distanceTo(attackGoal);
          const dashToGoal = new THREE.Vector3().subVectors(
            attackGoal,
            carrier.pos
          );
          dashToGoal.y = 0;

          if (
            dashToGoal.lengthSq() > 0.001 &&
            distToGoal < AI_ATTACK_DASH_DISTANCE &&
            Math.abs(carrier.pos.z) < GOAL_W / 2 + 1.15 &&
            now >= carrier.dashCooldownUntil
          ) {
            tryDash(carrier, dashToGoal);
          }
        }

        if (ballCarrier === 2 && aiWantsShoot) {
          aiShoot();
        }

        updateAITeammates();
      }

      function updateAITeammates() {
        const activeAI = getAIControlledBody();
        const supportLanes = [-2.45, 2.45, 0];

        aiOutfieldBodies.forEach((body, index) => {
          if (body === activeAI) return;

          let target;

          if (ballCarrier === 1) {
            // Defensa: los compañeros no se amontonan; cubren líneas entre balón y portería.
            const lane = supportLanes[index] || 0;
            target = getAIDefensivePoint(lane);
          } else if (ballCarrier === 2) {
            // Ataque: uno se abre arriba y otro abajo para dar sensación de equipo.
            const lane = index % 2 === 0 ? -2.35 : 2.35;
            target = getAIAttackSupportPoint(body, lane);
          } else {
            const closest = getClosestBodyTo(ballBody.pos, aiOutfieldBodies);
            if (closest.body === body) {
              target = ballBody.pos;
            } else {
              const lane = index % 2 === 0 ? -2.25 : 2.25;
              target = getAIDefensivePoint(lane);
            }
          }

          const speed = ballCarrier === 1 ? AI_DEFENSE_SPEED : AI_SUPPORT_SPEED;
          moveBodyArcadeTo(body, target, speed, 0.09);

          if (ballCarrier === 1) {
            const playerBody = getBodyByPlayer(1);
            const dashDir = new THREE.Vector3().subVectors(
              playerBody.pos,
              body.pos
            );
            dashDir.y = 0;

            if (
              dashDir.lengthSq() > 0.001 &&
              body.pos.distanceTo(playerBody.pos) < AI_DASH_PRESS_DISTANCE &&
              Math.random() < 0.02
            ) {
              tryDash(body, dashDir);
            }
          }
        });

        if (p2KeeperBody) updateKeeperAI(p2KeeperBody, 2);
      }

      function aiShoot() {
        if (ballCarrier !== 2 || gamePhase !== "playing") return;

        const now = performance.now();
        if (now - aiLastShotAt < AI_SHOOT_COOLDOWN) return;

        const body = getAIControlledBody();
        const goal = getGoalTargetForPlayer(2);
        const dir = new THREE.Vector3().subVectors(goal, body.pos);
        dir.y = 0;

        if (dir.lengthSq() === 0) return;
        dir.normalize();

        // Medium difficulty: the IA aims at the goal, but with a small intentional error.
        const aimError = THREE.MathUtils.randFloatSpread(0.32);
        const cos = Math.cos(aimError);
        const sin = Math.sin(aimError);

        const aimedDir = new THREE.Vector3(
          dir.x * cos - dir.z * sin,
          0,
          dir.x * sin + dir.z * cos
        ).normalize();

        const distanceToGoal = body.pos.distanceTo(goal);
        const distanceBoost = THREE.MathUtils.clamp(
          1 - distanceToGoal / 7,
          0,
          1
        );
        const force = THREE.MathUtils.lerp(
          AI_SHOOT_FORCE_MIN,
          AI_SHOOT_FORCE_MAX,
          0.42 + distanceBoost * 0.45
        );

        setLastTouch(2, aiCarrierIndex);
        ballCarrier = null;
        currentTurn = 2;
        aiWantsShoot = false;
        aiLastShotAt = now;
        aiPickupBlockedUntil = now + 480;

        ballBody.pos
          .copy(body.pos)
          .addScaledVector(aimedDir, body.r + ballBody.r + 0.42);
        ballBody.pos.y = ballBody.r;
        ballBody.vel.copy(aimedDir).multiplyScalar(force);
        ballBody.vel.y = 0.9;
        playKickSound(0.68);

        updateTurnUI();
      }

      function getGroundPoint(event) {
        const rect = canvas.getBoundingClientRect();
        const x = (event.clientX ?? event.touches?.[0]?.clientX) - rect.left;
        const y = (event.clientY ?? event.touches?.[0]?.clientY) - rect.top;
        mouse.set((x / rect.width) * 2 - 1, -(y / rect.height) * 2 + 1);
        raycaster.setFromCamera(mouse, camera);
        const target = new THREE.Vector3();
        raycaster.ray.intersectPlane(groundPlane, target);
        return target;
      }

      function isNearPlayer(point, body, threshold = 1.4) {
        return (
          point.distanceTo(new THREE.Vector3(body.pos.x, 0, body.pos.z)) <
          threshold
        );
      }

      canvas.addEventListener("mousedown", (e) => {
        if (gamePhase !== "idle") return;
        const activeBody = getActiveBody();
        const pt = getGroundPoint(e);
        if (pt && isNearPlayer(pt, activeBody)) {
          isDragging = true;
          dragStart = pt.clone();
          dragCurrent = pt.clone();
          gamePhase = "dragging";
          arrowLine.visible = true;
        }
      });

      canvas.addEventListener("mousemove", (e) => {
        if (!isDragging) return;
        dragCurrent = getGroundPoint(e) || dragCurrent;
        updateArrow();
        updateStrengthBar();
      });

      canvas.addEventListener("mouseup", (e) => {
        if (!isDragging) return;
        isDragging = false;
        shoot(getActiveBody());
        arrowLine.visible = false;
        movArrowGroup.visible = false;
        // Reset geometry to zero so no stale lines flash on re-show
        const _z = new THREE.Vector3();
        arrowGeo.setFromPoints([_z, _z]);
        strengthWrap.classList.remove("visible");
        dragStart = null;
        dragCurrent = null;
      });

      canvas.addEventListener(
        "touchstart",
        (e) => {
          e.preventDefault();
          if (gamePhase !== "idle") return;
          const activeBody = getActiveBody();
          const pt = getGroundPoint(e);
          if (pt && isNearPlayer(pt, activeBody)) {
            isDragging = true;
            dragStart = pt.clone();
            dragCurrent = pt.clone();
            gamePhase = "dragging";
            arrowLine.visible = true;
          }
        },
        { passive: false }
      );

      canvas.addEventListener(
        "touchmove",
        (e) => {
          e.preventDefault();
          if (!isDragging) return;
          dragCurrent = getGroundPoint(e) || dragCurrent;
          updateArrow();
          updateStrengthBar();
        },
        { passive: false }
      );

      canvas.addEventListener(
        "touchend",
        (e) => {
          e.preventDefault();
          if (!isDragging) return;
          isDragging = false;
          shoot(getActiveBody());
          arrowLine.visible = false;
          movArrowGroup.visible = false;
          const _z = new THREE.Vector3();
          arrowGeo.setFromPoints([_z, _z]);
          strengthWrap.classList.remove("visible");
        },
        { passive: false }
      );

      function updateArrow() {
        if (!dragStart || !dragCurrent) return;

        // Yellow rubber-band: from player to cursor drag point
        const activeBody = getActiveBody();
        const playerPos = new THREE.Vector3(
          activeBody.pos.x,
          0.55,
          activeBody.pos.z
        );
        const dragVec = new THREE.Vector3().subVectors(dragStart, dragCurrent);
        dragVec.y = 0;
        const dragLen = Math.min(dragVec.length(), MAX_DRAG);
        const dragDir = dragVec.clone().normalize();
        const dragEnd = playerPos
          .clone()
          .sub(dragDir.clone().multiplyScalar(dragLen));
        arrowGeo.setFromPoints([playerPos, dragEnd]);

        // Yellow 3D direction arrow: points in the launch direction
        const launchDir = dragDir.clone(); // same as drag, player shoots this way
        const arrowLen = 1.7 + (dragLen / MAX_DRAG) * 3.5;
        const arrowY = 1.05;

        const start = new THREE.Vector3(
          playerPos.x,
          arrowY,
          playerPos.z
        ).addScaledVector(launchDir, 0.75);
        const end = new THREE.Vector3(
          playerPos.x,
          arrowY,
          playerPos.z
        ).addScaledVector(launchDir, arrowLen);
        const mid = new THREE.Vector3()
          .addVectors(start, end)
          .multiplyScalar(0.5);
        const shaftLen = Math.max(0.2, start.distanceTo(end) - 0.42);
        const shaftCenter = start
          .clone()
          .addScaledVector(launchDir, shaftLen / 2);
        const headCenter = end.clone().addScaledVector(launchDir, -0.25);

        movArrowShaft.scale.set(1, shaftLen, 1);
        movArrowShaft.position.copy(shaftCenter);
        movArrowHead.position.copy(headCenter);

        const quat = new THREE.Quaternion().setFromUnitVectors(
          new THREE.Vector3(0, 1, 0),
          launchDir
        );
        movArrowShaft.quaternion.copy(quat);
        movArrowHead.quaternion.copy(quat);

        movArrowGroup.visible = true;
      }

      function updateStrengthBar() {
        if (!dragStart || !dragCurrent) return;
        strengthWrap.classList.add("visible");
        const drag = dragStart.distanceTo(dragCurrent);
        const pct = Math.min(drag / MAX_DRAG, 1) * 100;
        strengthFill.style.width = pct + "%";
      }

      function shoot(body) {
        // Rush mode uses keyboard charging instead of slingshot shooting.
        return;
      }

      // ─── AI desactivada en este archivo multiplayer ───────────
      function runAI() {
        // Simple AI: aim player towards ball, then try to hit ball toward goal
        const ballPos = new THREE.Vector3(ballBody.pos.x, 0, ballBody.pos.z);
        const playerPos = new THREE.Vector3(p2Body.pos.x, 0, p2Body.pos.z);
        const leftGoal = new THREE.Vector3(-FIELD_W / 2, 0, 0);

        // Direction: from player, through ball, toward left goal
        // Offset so we "get behind" the ball
        const ballToGoal = new THREE.Vector3()
          .subVectors(leftGoal, ballPos)
          .normalize();
        const offset = ballToGoal
          .clone()
          .multiplyScalar(-(p2Body.r + ballBody.r + 0.3));
        const targetBehindBall = ballPos.clone().add(offset);

        const toTarget = new THREE.Vector3().subVectors(
          targetBehindBall,
          playerPos
        );
        toTarget.y = 0;
        const dist = toTarget.length();
        const forceFactor =
          Math.min(dist * 0.4 + 0.3, 1.0) * (0.7 + Math.random() * 0.3);
        const force = forceFactor * MAX_FORCE;
        toTarget.normalize();

        p2Body.vel.set(toTarget.x * force, 2.0, toTarget.z * force);
        gamePhase = "simulating";
      }

      // ─── Goal detection ───────────────────────────────────────
      function checkGoal() {
        const bx = ballBody.pos.x;
        const bz = ballBody.pos.z;
        const GH = 1.4;
        const inZRange = Math.abs(bz) < GOAL_W / 2;
        const inHeight = ballBody.pos.y < GH + 0.3;

        if (inZRange && inHeight && bx < -(FIELD_W / 2 - 0.1)) {
          // Ball entered left goal → P2 scored
          triggerGoal(2);
          return true;
        }
        if (inZRange && inHeight && bx > FIELD_W / 2 - 0.1) {
          // Ball entered right goal → P1 scored
          triggerGoal(1);
          return true;
        }
        return false;
      }

      let goalTimeout = null;
      function triggerGoal(scorer) {
        if (gamePhase === "goal" || gamePhase === "win") return;
        gamePhase = "goal";
        pauseMatchTimer();
        ballCarrier = null;
        kickChargingPlayer = null;
        kickChargeStart = 0;
        playerPickupBlockedUntil = 0;
        aiPickupBlockedUntil = 0;
        aiLastShotAt = 0;
        aiWantsShoot = false;
        strengthWrap.classList.remove("visible");
        strengthFill.style.width = "0%";
        if (scorer === 1) {
          p1Score++;
          scoreP1El.textContent = p1Score;
          goalTextEl.textContent = "⚽ ¡GOL!";
          goalTextEl.style.color = p1TeamColor;
          scorerTextEl.textContent = getGoalScorerText(1);
        } else {
          p2Score++;
          scoreP2El.textContent = p2Score;
          goalTextEl.textContent = "⚽ ¡GOL!";
          goalTextEl.style.color = p2TeamColor;
          scorerTextEl.textContent = getGoalScorerText(2);
        }
        goalEvents.push({
          time: formatMatchTime(MATCH_DURATION - matchTimeLeft),
          team: getTeamDisplayName(scorer),
          scorer: getGoalScorerName(scorer),
        });
        registerGoalEvent(scorer);
        goalOverlay.classList.add("show");

        clearTimeout(goalTimeout);
        goalTimeout = setTimeout(() => {
          goalOverlay.classList.remove("show");
          resetPositions();
          ballCarrier = null;
          kickChargingPlayer = null;
          kickChargeStart = 0;
          playerPickupBlockedUntil = 0;
          aiPickupBlockedUntil = 0;
          aiLastShotAt = 0;
          aiNextDecisionAt = 0;
          aiMoveTarget.set(0, 0, 0);
          aiWantsShoot = false;
          controlledPlayerIndex = 0;
          aiCarrierIndex = 0;
          allPlayerBodies.forEach((body) => initRushBody(body, 1));
          allAIBodies.forEach((body) => initRushBody(body, -1));
          keys.clear();
          resumeMatchTimer();
          gamePhase = "playing";
          updateTurnUI();
          updateInstructionText();
        }, 2200);
      }

      /*function scheduleAI() {
  gamePhase = 'aiThinking';
  setTimeout(() => {
    if (gamePhase === 'aiThinking') runAI();
  }, 900 + Math.random() * 600);
}*/

      // ─── Simulate ─────────────────────────────────────────────
      const DT = 1 / 60;
      function simulate() {
        updateMatchClock();

        if (matchTimeLeft <= 0 && gamePhase !== "win") {
          endMatchByTime();
        }

        if (gamePhase !== "playing") return;

        updateRushChargeUI();

        for (let i = 0; i < 3; i++) {
          playerTeamBodies.forEach((body) => moveRushPlayer(body, 1));
          updateKeeperAI(p1KeeperBody, 1);
          updateRushAI();
          updateKeeperAI(p2KeeperBody, 2);

          allPlayerBodies.forEach((body) => body.update(DT / 3));
          allAIBodies.forEach((body) => body.update(DT / 3));

          if (!ballCarrier) {
            ballBody.update(DT / 3);
          }

          allPlayerBodies.forEach((body) => wallBounce(body));
          allAIBodies.forEach((body) => wallBounce(body));

          if (!ballCarrier) {
            wallBounce(ballBody);
          }

          for (let a = 0; a < playerTeamBodies.length; a++) {
            for (let b = a + 1; b < playerTeamBodies.length; b++) {
              collideBodies(playerTeamBodies[a], playerTeamBodies[b]);
            }
          }

          for (let a = 0; a < aiTeamBodies.length; a++) {
            for (let b = a + 1; b < aiTeamBodies.length; b++) {
              collideBodies(aiTeamBodies[a], aiTeamBodies[b]);
            }
          }

          allPlayerBodies.forEach((playerBody) => {
            allAIBodies.forEach((aiBody) => collideBodies(playerBody, aiBody));
          });

          if (!ballCarrier) {
            allPlayerBodies.forEach((body) => collideBodies(body, ballBody));
            allAIBodies.forEach((body) => collideBodies(body, ballBody));
          }

          updateBallPossession();
          updateDashSteal();
          updateContactSteal();
        }

        checkGoal();
      }

      // ─── Sync meshes ──────────────────────────────────────────
      function syncMeshes() {
        p1Mesh.position.copy(p1Body.pos);
        p1Mate1Mesh.position.copy(p1Mate1Body.pos);
        p1Mate2Mesh.position.copy(p1Mate2Body.pos);
        p1KeeperMesh.position.copy(p1KeeperBody.pos);
        p2Mesh.position.copy(p2Body.pos);
        p2Mate1Mesh.position.copy(p2Mate1Body.pos);
        p2Mate2Mesh.position.copy(p2Mate2Body.pos);
        p2KeeperMesh.position.copy(p2KeeperBody.pos);
        ballMesh.position.copy(ballBody.pos);

        updatePlayerMeshFacing(p1Mesh, p1Body);
        updatePlayerMeshFacing(p1Mate1Mesh, p1Mate1Body);
        updatePlayerMeshFacing(p1Mate2Mesh, p1Mate2Body);
        updatePlayerMeshFacing(p1KeeperMesh, p1KeeperBody);

        updatePlayerMeshFacing(p2Mesh, p2Body);
        updatePlayerMeshFacing(p2Mate1Mesh, p2Mate1Body);
        updatePlayerMeshFacing(p2Mate2Mesh, p2Mate2Body);
        updatePlayerMeshFacing(p2KeeperMesh, p2KeeperBody);

        p1NameLabel.position.set(
          p1Body.pos.x,
          p1Body.pos.y + 1.45,
          p1Body.pos.z
        );
        p1Mate1NameLabel.position.set(
          p1Mate1Body.pos.x,
          p1Mate1Body.pos.y + 1.45,
          p1Mate1Body.pos.z
        );
        p1Mate2NameLabel.position.set(
          p1Mate2Body.pos.x,
          p1Mate2Body.pos.y + 1.45,
          p1Mate2Body.pos.z
        );
        p1KeeperNameLabel.position.set(
          p1KeeperBody.pos.x,
          p1KeeperBody.pos.y + 1.45,
          p1KeeperBody.pos.z
        );

        p2NameLabel.position.set(
          p2Body.pos.x,
          p2Body.pos.y + 1.45,
          p2Body.pos.z
        );
        p2Mate1NameLabel.position.set(
          p2Mate1Body.pos.x,
          p2Mate1Body.pos.y + 1.45,
          p2Mate1Body.pos.z
        );
        p2Mate2NameLabel.position.set(
          p2Mate2Body.pos.x,
          p2Mate2Body.pos.y + 1.45,
          p2Mate2Body.pos.z
        );
        p2KeeperNameLabel.position.set(
          p2KeeperBody.pos.x,
          p2KeeperBody.pos.y + 1.45,
          p2KeeperBody.pos.z
        );

        // Controlled player indicator.
        const controlledBody = getControlledPlayerBody();
        controlledIndicatorGroup.visible =
          gamePhase !== "win" && !!controlledBody;

        if (controlledBody) {
          const arrowBob = Math.sin(Date.now() * 0.008) * 0.08;

          const movementDir = controlledBody.vel
            ? controlledBody.vel.clone()
            : new THREE.Vector3();
          movementDir.y = 0;

          const facingDir =
            movementDir.lengthSq() > 0.08
              ? movementDir
              : controlledBody.facing
              ? controlledBody.facing.clone()
              : new THREE.Vector3(1, 0, 0);

          facingDir.y = 0;
          if (facingDir.lengthSq() < 0.001) facingDir.set(1, 0, 0);
          facingDir.normalize();

          controlledIndicatorGroup.position.set(
            controlledBody.pos.x,
            0,
            controlledBody.pos.z
          );

          controlledArrow.position.y = controlledBody.pos.y + 1.08 + arrowBob;
          controlledRing.rotation.y += 0.018;

          const markerAngle = Math.atan2(facingDir.x, facingDir.z) + Math.PI;
          controlledIndicatorGroup.rotation.y = markerAngle;
        }

        // Rolling rotation
        if (ballBody.vel.lengthSq() > 0.0001) {
          const rollAxis = new THREE.Vector3(
            ballBody.vel.z,
            0,
            -ballBody.vel.x
          ).normalize();
          const rollSpeed = ballBody.vel.length() * 0.05;
          ballMesh.rotateOnWorldAxis(rollAxis, rollSpeed);
        }

        p1Shadow.position.set(p1Body.pos.x, 0.01, p1Body.pos.z);
        p1Mate1Shadow.position.set(p1Mate1Body.pos.x, 0.01, p1Mate1Body.pos.z);
        p1Mate2Shadow.position.set(p1Mate2Body.pos.x, 0.01, p1Mate2Body.pos.z);
        p1KeeperShadow.position.set(
          p1KeeperBody.pos.x,
          0.01,
          p1KeeperBody.pos.z
        );
        p2Shadow.position.set(p2Body.pos.x, 0.01, p2Body.pos.z);
        p2Mate1Shadow.position.set(p2Mate1Body.pos.x, 0.01, p2Mate1Body.pos.z);
        p2Mate2Shadow.position.set(p2Mate2Body.pos.x, 0.01, p2Mate2Body.pos.z);
        p2KeeperShadow.position.set(
          p2KeeperBody.pos.x,
          0.01,
          p2KeeperBody.pos.z
        );
        ballShadow.position.set(ballBody.pos.x, 0.01, ballBody.pos.z);

        // Fade shadows by height (no scaling — avoids diamond distortion)
        const p1h = Math.max(0.05, 0.28 - p1Body.pos.y * 0.06);
        const p1m1h = Math.max(0.05, 0.28 - p1Mate1Body.pos.y * 0.06);
        const p1m2h = Math.max(0.05, 0.28 - p1Mate2Body.pos.y * 0.06);
        const p1kh = Math.max(0.05, 0.28 - p1KeeperBody.pos.y * 0.06);
        const p2h = Math.max(0.05, 0.28 - p2Body.pos.y * 0.06);
        const p2m1h = Math.max(0.05, 0.28 - p2Mate1Body.pos.y * 0.06);
        const p2m2h = Math.max(0.05, 0.28 - p2Mate2Body.pos.y * 0.06);
        const p2kh = Math.max(0.05, 0.28 - p2KeeperBody.pos.y * 0.06);
        const bh = Math.max(0.04, 0.22 - ballBody.pos.y * 0.07);
        p1Shadow.material.opacity = p1h;
        p1Mate1Shadow.material.opacity = p1m1h;
        p1Mate2Shadow.material.opacity = p1m2h;
        p1KeeperShadow.material.opacity = p1kh;
        p2Shadow.material.opacity = p2h;
        p2Mate1Shadow.material.opacity = p2m1h;
        p2Mate2Shadow.material.opacity = p2m2h;
        p2KeeperShadow.material.opacity = p2kh;
        ballShadow.material.opacity = bh;

        // Wobble bobbles when moving
        const p1s = Math.min(p1Body.speed / 10, 0.12);
        const p1m1s = Math.min(p1Mate1Body.speed / 10, 0.12);
        const p1m2s = Math.min(p1Mate2Body.speed / 10, 0.12);
        const p2s = Math.min(p2Body.speed / 10, 0.12);
        const p2m1s = Math.min(p2Mate1Body.speed / 10, 0.12);
        const p2m2s = Math.min(p2Mate2Body.speed / 10, 0.12);
        p1Mesh.scale.y =
          PLAYER_VISUAL_SCALE * (1 + Math.sin(Date.now() * 0.02) * p1s);
        p1Mate1Mesh.scale.y =
          PLAYER_VISUAL_SCALE *
          (1 + Math.sin(Date.now() * 0.02 + 0.45) * p1m1s);
        p1Mate2Mesh.scale.y =
          PLAYER_VISUAL_SCALE * (1 + Math.sin(Date.now() * 0.02 + 0.9) * p1m2s);
        p2Mesh.scale.y =
          PLAYER_VISUAL_SCALE * (1 + Math.sin(Date.now() * 0.02 + 1) * p2s);
        p2Mate1Mesh.scale.y =
          PLAYER_VISUAL_SCALE *
          (1 + Math.sin(Date.now() * 0.02 + 1.45) * p2m1s);
        p2Mate2Mesh.scale.y =
          PLAYER_VISUAL_SCALE * (1 + Math.sin(Date.now() * 0.02 + 1.9) * p2m2s);
      }

      // ─── Particle effects ─────────────────────────────────────
      const particles = [];
      function spawnParticles(x, y, z, color, count = 12) {
        for (let i = 0; i < count; i++) {
          const geo = new THREE.SphereGeometry(
            0.08 + Math.random() * 0.08,
            6,
            4
          );
          const mat = new THREE.MeshBasicMaterial({ color });
          const m = new THREE.Mesh(geo, mat);
          m.position.set(x, y, z);
          const v = new THREE.Vector3(
            (Math.random() - 0.5) * 8,
            Math.random() * 6 + 2,
            (Math.random() - 0.5) * 8
          );
          scene.add(m);
          particles.push({ mesh: m, vel: v, life: 1.0 });
        }
      }

      function updateParticles(dt) {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life -= dt * 1.5;
          p.vel.y -= 12 * dt;
          p.mesh.position.addScaledVector(p.vel, dt);
          p.mesh.material.opacity = p.life;
          p.mesh.material.transparent = true;
          if (p.life <= 0) {
            scene.remove(p.mesh);
            particles.splice(i, 1);
          }
        }
      }

      function getGoalScorerName(scorerTeam) {
        if (lastTouchTeam === scorerTeam) {
          return getRosterName(scorerTeam, lastTouchIndex);
        }

        return `${getRosterName(lastTouchTeam, lastTouchIndex)} (Autogol)`;
      }

      // Spawn particles on goal
      let lastGoalCheck = false;
      function checkGoalParticles() {
        const scored =
          ballBody.pos.x < -(FIELD_W / 2) || ballBody.pos.x > FIELD_W / 2;
        if (scored && !lastGoalCheck) {
          spawnParticles(ballBody.pos.x, 1, ballBody.pos.z, 0xffee44, 20);
          spawnParticles(ballBody.pos.x, 1, ballBody.pos.z, 0xff6644, 15);
        }
        lastGoalCheck = scored;
      }

      // ─── Animate ──────────────────────────────────────────────
      let lastTime = 0;
      function animate(time) {
        requestAnimationFrame(animate);
        const dt = Math.min((time - lastTime) / 1000, 0.05);
        lastTime = time;

        simulate();
        syncMeshes();
        updatePowerups();
        updateParticles(dt);
        checkGoalParticles();

        renderer.render(scene, camera);
      }
      requestAnimationFrame(animate);

      // ─── Restart ──────────────────────────────────────────────
      window.restartGame = function () {
        p1Score = 0;
        p2Score = 0;
        goalEvents = [];
        goalEventLocked = false;
        renderMatchStats();
        scoreP1El.textContent = "0";
        scoreP2El.textContent = "0";
        currentTurn = 1;
        ballCarrier = null;
        kickChargingPlayer = null;
        kickChargeStart = 0;
        playerPickupBlockedUntil = 0;
        aiPickupBlockedUntil = 0;
        aiLastShotAt = 0;
        aiNextDecisionAt = 0;
        aiMoveTarget.set(0, 0, 0);
        aiWantsShoot = false;
        updateTurnUI();
        updateInstructionText();
        resetPositions();
        winOverlay.classList.remove("show");
        goalOverlay.classList.remove("show");
        gamePhase = "playing";
        clearTimeout(goalTimeout);
        clearTimeout(powerupRespawnTimer);
        currentPowerup = null;
        heldPowerupP1 = false;
        heldPowerupP2 = false;
        forcePowerupUntilP1 = 0;
        forcePowerupUntilP2 = 0;
        powerupMesh.visible = false;
        updatePowerupInventory();
        schedulePowerupRespawn(1200);
        arrowLine.visible = false;
        movArrowGroup.visible = false;
        dragStart = null;
        dragCurrent = null;
        isDragging = false;
        strengthWrap.classList.remove("visible");
        strengthFill.style.width = "0%";
        controlledPlayerIndex = 0;
        aiCarrierIndex = 0;
        playerTeamBodies.forEach((body) => initRushBody(body, 1));
        aiTeamBodies.forEach((body) => initRushBody(body, -1));
        keys.clear();
      };

      // ─── Background stars ─────────────────────────────────────
      for (let i = 0; i < 200; i++) {
        const sg = new THREE.SphereGeometry(0.04 + Math.random() * 0.06, 4, 4);
        const sm = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.3 + Math.random() * 0.5,
        });
        const star = new THREE.Mesh(sg, sm);
        const angle = Math.random() * Math.PI * 2;
        const dist = 25 + Math.random() * 30;
        star.position.set(
          Math.cos(angle) * dist,
          5 + Math.random() * 15,
          Math.sin(angle) * dist
        );
        scene.add(star);
      }
    </script>
